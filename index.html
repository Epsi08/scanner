<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scanner">
<meta name="theme-color" content="#ffffff">
<title>Scanner</title>
<style>
  :root {
    --accent: #F7821B;          /* orange Genius */
    --accent-dark: #E0700C;
    --bg: #FFFFFF;
    --bg-grouped: #F2F2F7;      /* gris iOS */
    --card: #FFFFFF;
    --editor-bg: #1C1C1E;       /* fond sombre éditeur */
    --text: #1C1C1E;
    --text-2: #8E8E93;
    --sep: #E5E5EA;
    --radius: 14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  .hidden { display: none !important; }

  /* ---------- Écran générique ---------- */
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    background: var(--bg);
  }

  /* ---------- Barre de titre ---------- */
  .topbar {
    padding-top: calc(var(--safe-top) + 8px);
    height: calc(var(--safe-top) + 52px);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    flex-shrink: 0;
    border-bottom: 1px solid var(--sep);
    background: var(--bg);
  }
  .topbar.dark { background: var(--editor-bg); border-bottom: none; color: #fff; }
  .topbar .title { font-size: 17px; font-weight: 600; }
  .topbar .left, .topbar .right {
    position: absolute; top: calc(var(--safe-top) + 8px); height: 44px;
    display: flex; align-items: center; gap: 14px;
  }
  .topbar .left { left: 12px; }
  .topbar .right { right: 12px; }
  .iconbtn {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
  }
  .topbar.dark .iconbtn { color: #fff; background: rgba(255,255,255,.12); }
  .iconbtn svg { width: 24px; height: 24px; }

  /* ---------- HOME ---------- */
  #home .content {
    flex: 1; display: flex; flex-direction: column;
    overflow-y: auto;
  }
  /* état vide */
  .empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 32px; gap: 14px; color: var(--text-2);
  }
  .empty .doc-icon { color: var(--sep); }
  .empty .doc-icon svg { width: 76px; height: 76px; }
  .empty h2 { color: var(--text); font-size: 20px; font-weight: 600; margin: 0; }
  .empty p { margin: 0; font-size: 15px; max-width: 260px; line-height: 1.4; }

  /* galerie de pages */
  .gallery {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 14px; padding: 16px;
  }
  .page-card {
    background: var(--card); border-radius: var(--radius);
    overflow: hidden; position: relative;
    box-shadow: 0 1px 4px rgba(0,0,0,.10);
    aspect-ratio: 3/4;
  }
  .page-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .page-card .num {
    position: absolute; top: 8px; left: 8px;
    background: rgba(0,0,0,.6); color: #fff;
    font-size: 12px; font-weight: 600;
    padding: 2px 8px; border-radius: 20px;
  }

  /* ---------- Barre d'action du bas (home) ---------- */
  .bottombar {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-around;
    padding: 10px 12px calc(var(--safe-bottom) + 10px);
    border-top: 1px solid var(--sep);
    background: var(--bg);
  }
  .bottombar button {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 11px; color: var(--text-2); flex: 1;
  }
  .bottombar button svg { width: 26px; height: 26px; }
  .bottombar button.primary { color: var(--accent); }

  /* FAB scanner (état vide) */
  .fab {
    position: fixed; bottom: calc(var(--safe-bottom) + 24px); left: 50%; transform: translateX(-50%);
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(247,130,27,.45);
  }
  .fab svg { width: 32px; height: 32px; }

  /* ---------- ÉDITEUR ---------- */
  #editor { background: var(--editor-bg); }
  #editor .canvas-wrap {
    flex: 1; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  #editImg { display: block; max-width: 100%; max-height: 100%; }
  #editSvg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .corner {
    fill: var(--accent); stroke: #fff; stroke-width: 2;
  }
  .hit { fill: transparent; }
  .edge { stroke: var(--accent); stroke-width: 2.5; fill: rgba(247,130,27,.12); }

  /* loupe (zoom au doigt) */
  #loupe {
    position: absolute; top: 14px; left: 14px;
    width: 92px; height: 92px; border-radius: 50%;
    border: 3px solid #fff; box-shadow: 0 2px 12px rgba(0,0,0,.55);
    display: none; z-index: 6; background: #000; pointer-events: none;
  }
  #loupe.show { display: block; }

  /* barre interrupteur aperçu */
  .preview-bar {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px 4px; background: var(--editor-bg); color: #c8c8c8; font-size: 13px;
  }
  .switch { position: relative; display: inline-block; width: 46px; height: 28px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0; background: #4a4a4c; border-radius: 28px;
    transition: background .2s;
  }
  .switch .track::before {
    content: ''; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px;
    background: #fff; border-radius: 50%; transition: transform .2s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::before { transform: translateX(18px); }

  /* curseur de noirceur */
  .darkness {
    flex-shrink: 0; display: none; align-items: center; gap: 12px;
    padding: 8px 18px 2px; background: var(--editor-bg); color: #9a9a9a; font-size: 11px;
  }
  .darkness.show { display: flex; }
  .darkness input { flex: 1; accent-color: var(--accent); height: 26px; }

  /* filtres */
  .filters {
    flex-shrink: 0; display: flex; gap: 10px; overflow-x: auto;
    padding: 14px 16px 6px; background: var(--editor-bg);
  }
  .chip {
    flex-shrink: 0; text-align: center; color: #aaa; font-size: 12px;
  }
  .chip .swatch {
    width: 58px; height: 58px; border-radius: 10px; margin-bottom: 5px;
    border: 2.5px solid transparent; background: #333;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #888; overflow: hidden;
  }
  .chip.active { color: var(--accent); font-weight: 600; }
  .chip.active .swatch { border-color: var(--accent); }

  /* outils éditeur */
  .edit-tools {
    flex-shrink: 0; display: flex; justify-content: space-around;
    padding: 8px 12px calc(var(--safe-bottom) + 12px);
    background: var(--editor-bg);
  }
  .edit-tools button {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: #fff; font-size: 11px;
  }
  .edit-tools button svg { width: 24px; height: 24px; }
  .edit-tools button.danger { color: #FF453A; }

  /* ---------- APERÇU GRAND FORMAT ---------- */
  #viewer { background: var(--editor-bg); }
  .viewer-body {
    flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
    overflow: hidden; padding: 10px;
  }
  #viewerImg {
    max-width: 100%; max-height: 100%; object-fit: contain;
    box-shadow: 0 4px 24px rgba(0,0,0,.5); background: #fff;
  }
  .viewer-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,.14); color: #fff;
    display: flex; align-items: center; justify-content: center; z-index: 2;
  }
  .viewer-nav svg { width: 26px; height: 26px; }
  #viewerPrev { left: 8px; } #viewerNext { right: 8px; }
  .viewer-nav.hidden { display: none; }

  /* ---------- CAMÉRA LIVE ---------- */
  #camera { background: #000; }
  #camVideo {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: #000;
  }
  #camOverlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .cam-top {
    position: absolute; top: 0; left: 0; right: 0;
    padding-top: calc(var(--safe-top) + 10px);
    display: flex; align-items: center; gap: 12px;
    padding-left: 14px; padding-right: 14px; padding-bottom: 10px;
    background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,0));
    z-index: 3;
  }
  .cam-top .iconbtn { color: #fff; background: rgba(255,255,255,.15); }
  .cam-hint { color: #fff; font-size: 14px; font-weight: 500; }
  .cam-hint.locked { color: #34C759; }
  .cam-res {
    margin-left: auto; color: #fff; font-size: 12px; font-weight: 600;
    background: rgba(255,255,255,.15); padding: 3px 9px; border-radius: 10px;
  }
  .cam-res:empty { display: none; }
  .cam-bottom {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding-bottom: calc(var(--safe-bottom) + 28px); padding-top: 20px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.55));
    z-index: 3;
  }
  .shutter {
    width: 74px; height: 74px; border-radius: 50%;
    border: 4px solid #fff; background: transparent;
    display: flex; align-items: center; justify-content: center;
  }
  .shutter span {
    width: 58px; height: 58px; border-radius: 50%; background: #fff;
    transition: transform .1s;
  }
  .shutter:active span { transform: scale(.88); }

  /* ---------- Feuille d'export ---------- */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.4);
    display: flex; align-items: flex-end; z-index: 50;
    animation: fade .2s ease;
  }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  .sheet {
    width: 100%; background: var(--bg-grouped);
    border-radius: 18px 18px 0 0;
    padding: 8px 16px calc(var(--safe-bottom) + 16px);
    animation: slideup .25s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes slideup { from { transform: translateY(100%) } to { transform: translateY(0) } }
  .sheet .grabber { width: 38px; height: 5px; border-radius: 3px; background: #C7C7CC; margin: 6px auto 14px; }
  .sheet h3 { text-align: center; margin: 0 0 4px; font-size: 17px; }
  .sheet .sub { text-align: center; color: var(--text-2); font-size: 13px; margin-bottom: 18px; }
  .sheet .sub b { color: var(--accent); }
  .format-row { display: flex; gap: 12px; margin-bottom: 12px; }
  .format-row button {
    flex: 1; min-width: 0; background: var(--card); border-radius: var(--radius);
    padding: 16px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .format-row button svg { width: 28px; height: 28px; color: var(--accent); }
  .format-row button .hint { font-size: 11px; font-weight: 400; color: var(--text-2); }
  .sheet .cancel {
    width: 100%; background: var(--card); border-radius: var(--radius);
    padding: 15px; font-size: 16px; font-weight: 600; color: var(--accent);
    margin-top: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }

  /* ---------- Overlay chargement ---------- */
  .loader {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.55); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  }
  .spinner {
    width: 42px; height: 42px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,.25); border-top-color: #fff;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg) } }
  .loader span { font-size: 15px; }

  /* toast */
  .toast {
    position: fixed; bottom: calc(var(--safe-bottom) + 90px); left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.85); color: #fff; padding: 11px 18px; border-radius: 22px;
    font-size: 14px; z-index: 200; max-width: 86%; text-align: center;
    animation: fade .2s ease;
  }
</style>
</head>
<body>

<!-- =================== HOME =================== -->
<section id="home" class="screen">
  <div class="topbar">
    <div class="title">Scanner</div>
    <div class="right">
      <button class="iconbtn" id="newDocBtn" title="Nouveau document" aria-label="Nouveau document">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 11v6"/><path d="M9 14h6"/></svg>
      </button>
    </div>
  </div>

  <div class="content" id="homeContent">
    <!-- état vide -->
    <div class="empty" id="emptyState">
      <div class="doc-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      </div>
      <h2>Aucune page</h2>
      <p>Appuie sur le bouton pour scanner ton premier document.</p>
    </div>

    <!-- galerie (cachée tant que vide) -->
    <div class="gallery hidden" id="gallery"></div>
  </div>

  <!-- FAB visible en état vide -->
  <button class="fab" id="fabScan" aria-label="Scanner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.5"/></svg>
  </button>

  <!-- barre du bas visible dès qu'il y a des pages -->
  <div class="bottombar hidden" id="homeBar">
    <button id="addPagesBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Ajouter
    </button>
    <button class="primary" id="exportBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M12 2v14"/><path d="m7 7 5-5 5 5"/></svg>
      Exporter
    </button>
  </div>
</section>

<!-- =================== ÉDITEUR =================== -->
<section id="editor" class="screen hidden">
  <div class="topbar dark">
    <button class="iconbtn" id="editCancel" style="position:absolute;left:12px;top:calc(var(--safe-top) + 8px);">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="title">Ajuster</div>
    <button class="iconbtn" id="editDone" style="position:absolute;right:12px;top:calc(var(--safe-top) + 8px);color:var(--accent);font-weight:700;width:auto;border-radius:20px;padding:0 6px;">
      <span style="font-size:16px;font-weight:600;">OK</span>
    </button>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <img id="editImg" alt="">
    <svg id="editSvg"></svg>
    <canvas id="loupe" width="180" height="180"></canvas>
  </div>

  <div class="preview-bar">
    <span>Aperçu du rendu en direct</span>
    <label class="switch">
      <input type="checkbox" id="livePreviewToggle">
      <span class="track"></span>
    </label>
  </div>

  <div class="darkness" id="darknessRow">
    <span>Clair</span>
    <input type="range" id="darknessSlider" min="0" max="100" value="50" aria-label="Noirceur">
    <span>Foncé</span>
  </div>

  <div class="filters" id="filters">
    <button class="chip active" data-filter="bw"><div class="swatch">N&amp;B</div>Noir &amp; blanc</button>
    <button class="chip" data-filter="color"><div class="swatch">Coul.</div>Couleur</button>
  </div>

  <div class="edit-tools">
    <button id="rotL">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      Gauche
    </button>
    <button id="rotR">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      Droite
    </button>
    <button id="resetCorners">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
      Tout
    </button>
    <button class="danger" id="deletePage">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      Suppr.
    </button>
  </div>
</section>

<!-- =================== APERÇU GRAND FORMAT =================== -->
<section id="viewer" class="screen hidden">
  <div class="topbar dark">
    <button class="iconbtn" id="viewerBack" style="position:absolute;left:12px;top:calc(var(--safe-top) + 8px);">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="title" id="viewerTitle">Page</div>
  </div>
  <div class="viewer-body" id="viewerBody">
    <button class="viewer-nav" id="viewerPrev" aria-label="Précédente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <img id="viewerImg" alt="Aperçu">
    <button class="viewer-nav" id="viewerNext" aria-label="Suivante">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>
  <div class="edit-tools">
    <button id="viewerEdit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      Modifier
    </button>
    <button id="viewerExport">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M12 2v14"/><path d="m7 7 5-5 5 5"/></svg>
      Exporter
    </button>
    <button class="danger" id="viewerDelete">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      Suppr.
    </button>
  </div>
</section>

<!-- =================== CAMÉRA LIVE =================== -->
<section id="camera" class="screen hidden">
  <video id="camVideo" playsinline muted autoplay></video>
  <canvas id="camOverlay"></canvas>
  <div class="cam-top">
    <button class="iconbtn" id="camCancel" aria-label="Fermer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <span id="camHint" class="cam-hint">Recherche du document…</span>
    <span id="camRes" class="cam-res"></span>
  </div>
  <div class="cam-bottom">
    <button id="camShoot" class="shutter" aria-label="Capturer"><span></span></button>
  </div>
</section>

<!-- inputs : repli prise de photo (capture) + photothèque (sans capture) -->
<input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
<input type="file" id="libraryInput" accept="image/*" class="hidden">

<!-- loader -->
<div class="loader hidden" id="loader"><div class="spinner"></div><span id="loaderText">Traitement…</span></div>

<!-- libs -->
<script src="jspdf.umd.min.js"></script>
<script>
/* ============================================================
   État global
   ============================================================ */
let cvReady = false;
let cvFailed = false;      // OpenCV introuvable (local + CDN) : mode dégradé
const pages = [];          // { baseBlob, blob (JPEG final), url, thumb, w, h, corners, rotation, filter, darkness }
let editState = null;      // état de l'éditeur en cours
const MAX_SIDE = 3200;     // résolution max conservée (≈ 230 dpi sur un A4 plein cadre)
const DETECT_SIDE = 800;   // la détection des coins tourne sur une copie réduite

const $ = (id) => document.getElementById(id);

/* OpenCV chargé en différé (gros fichier ~10 Mo).
   Copie locale versionnée avec l'app (docs.opencv.org/4.x est un fichier
   mouvant qui peut casser l'app à distance) ; repli CDN si absente. */
function loadOpenCV(src, fallback) {
  const s = document.createElement('script');
  s.src = src;
  s.async = true;
  s.onload = () => {
    if (window.cv && cv.getBuildInformation) { cvReady = true; }
    else if (window.cv) { cv['onRuntimeInitialized'] = () => { cvReady = true; }; }
  };
  s.onerror = () => {
    if (fallback) { console.warn('OpenCV local absent, repli CDN'); loadOpenCV(fallback, null); }
    else { cvFailed = true; console.warn('OpenCV non chargé — mode dégradé'); }
  };
  document.body.appendChild(s);
}
loadOpenCV('opencv.js', 'https://docs.opencv.org/4.x/opencv.js');

/* attend le moteur OpenCV (sinon le scan serait dégradé sans prévenir) */
function whenCvReady(timeoutMs = 30000) {
  if (cvReady) return Promise.resolve(true);
  return new Promise(resolve => {
    const t0 = Date.now();
    const tick = () => {
      if (cvReady) resolve(true);
      else if (cvFailed || Date.now() - t0 > timeoutMs) resolve(false);
      else setTimeout(tick, 150);
    };
    tick();
  });
}
async function ensureCv(msgAfter) {
  if (cvReady) return true;
  showLoader('Chargement du moteur de scan…');
  const ok = await whenCvReady();
  if (!ok) toast('Moteur de scan indisponible : qualité réduite.');
  if (msgAfter) showLoader(msgAfter);
  return ok;
}

/* libère tout de suite la mémoire d'un canvas (Safari iOS la rend tard sinon) */
function releaseCanvas(c) { if (c) { c.width = 0; c.height = 0; } }
function freeBitmap(b) {
  if (!b) return;
  if (b.close) b.close();
  else if (b.src && b.src.startsWith('blob:')) URL.revokeObjectURL(b.src);
}
function canvasToBlob(c, q) {
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/jpeg', q));
}
/* vraie miniature (480 px) pour la galerie, pas l'image pleine résolution */
function makeThumb(c) {
  const s = Math.min(1, 480 / c.width);
  const t = document.createElement('canvas');
  t.width = Math.round(c.width * s); t.height = Math.round(c.height * s);
  t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
  const url = t.toDataURL('image/jpeg', 0.75);
  releaseCanvas(t);
  return url;
}
function freePage(p) { if (p && p.url) URL.revokeObjectURL(p.url); }

async function processImageFile(file) {
  if (!file) return;
  showLoader('Lecture de la photo…');
  try {
    const bmp = await loadBitmap(file);
    const baseCanvas = bitmapToCanvas(bmp, MAX_SIDE);
    freeBitmap(bmp);

/* ============================================================
   CAMÉRA LIVE — détection du document en temps réel + capture
   ============================================================ */
let camStream = null, camRAF = null;
let camLastQuad = null;        // dernier quad lissé (espace canvas de détection)
let camDetScale = 1;          // facteur canvas détection -> pixels vidéo
let camFrameCount = 0;        // compteur de frames rAF pour le skip
let camQuadHistory = [];      // historique des N derniers quads détectés (lissage)
let camLastHitTime = 0;       // dernière détection réussie (expiration du cadre)
const CAM_QUAD_TTL = 1500;    // ms sans détection avant de retirer le cadre
const camDet = document.createElement('canvas');

async function startLiveCamera() {
  addingPage = pages.length > 0;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return triggerInput('cameraInput'); // repli prise de photo
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      // on demande le maximum (4K) : sans photo native, l'image capturée vient de ce flux
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 3840 }, height: { ideal: 2160 } },
      audio: false,
    });
  } catch (err) {
    console.warn('Caméra live indisponible, repli photo', err);
    toast('Caméra live indisponible — mode photo.');
    return triggerInput('cameraInput');
  }
  const v = $('camVideo');
  v.srcObject = camStream;
  camLastQuad = null;
  camQuadHistory = [];
  camFrameCount = 0;
  camLastHitTime = 0;
  $('camRes').textContent = '';
  show('camera');
  $('camHint').textContent = 'Recherche du document…';
  $('camHint').classList.remove('locked');
  try { await v.play(); } catch (_) {}
  const begin = () => {
    resizeOverlay();
    // résolution réelle du flux : 8,3 MP = 4K ; 2,1 MP = limité au 1080p
    const mp = v.videoWidth * v.videoHeight / 1e6;
    $('camRes').textContent = mp ? mp.toFixed(1).replace('.', ',') + ' MP' : '';
    camLoop();
  };
  if (v.videoWidth) begin(); else v.onloadedmetadata = begin;
}

function resizeOverlay() {
  const ov = $('camOverlay');
  ov.width = ov.clientWidth; ov.height = ov.clientHeight;
}

/* rect d'affichage de la vidéo (object-fit: contain) */
function videoDisplayRect() {
  const v = $('camVideo'), ov = $('camOverlay');
  const cw = ov.width, ch = ov.height, vw = v.videoWidth, vh = v.videoHeight;
  if (!vw || !vh) return { offX: 0, offY: 0, scaleFromVideo: 1 };
  const vAR = vw / vh, cAR = cw / ch;
  let dispW, dispH;
  if (vAR > cAR) { dispW = cw; dispH = cw / vAR; } else { dispH = ch; dispW = ch * vAR; }
  return { offX: (cw - dispW) / 2, offY: (ch - dispH) / 2, scaleFromVideo: dispW / vw };
}

function smoothQuad(history) {
  if (history.length <= 1) return history[0] || null;
  return history[0].map((_, i) => ({
    x: history.reduce((s, q) => s + q[i].x, 0) / history.length,
    y: history.reduce((s, q) => s + q[i].y, 0) / history.length,
  }));
}

function camLoop() {
  if (!camStream) return;
  const v = $('camVideo');
  camFrameCount++;
  if (cvReady && v.videoWidth && camFrameCount % 4 === 0) {
    const detW = 480, detH = Math.round(detW * v.videoHeight / v.videoWidth);
    camDet.width = detW; camDet.height = detH;
    camDet.getContext('2d').drawImage(v, 0, 0, detW, detH);
    camDetScale = v.videoWidth / detW;
    const q = detectQuad(camDet);
    if (q) {
      camQuadHistory.push(q);
      if (camQuadHistory.length > 5) camQuadHistory.shift();
      camLastQuad = smoothQuad(camQuadHistory);
      camLastHitTime = performance.now();
    } else if (camLastQuad && performance.now() - camLastHitTime > CAM_QUAD_TTL) {
      // plus rien depuis un moment : le cadre ne correspond plus à la scène
      camLastQuad = null;
      camQuadHistory = [];
    }
    // sinon : on garde le dernier cadre valide (stabilité entre deux frames)
  }
  drawCamOverlay();
  camRAF = requestAnimationFrame(camLoop);
}

function drawCamOverlay() {
  const ov = $('camOverlay'), ctx = ov.getContext('2d');
  ctx.clearRect(0, 0, ov.width, ov.height);
  const hint = $('camHint');
  if (!camLastQuad) {
    hint.textContent = cvReady ? 'Recherche du document…' : 'Chargement…';
    hint.classList.remove('locked');
    return;
  }
  hint.textContent = 'Document détecté ✓';
  hint.classList.add('locked');
  const r = videoDisplayRect();
  const pts = camLastQuad.map(p => ({
    x: r.offX + p.x * camDetScale * r.scaleFromVideo,
    y: r.offY + p.y * camDetScale * r.scaleFromVideo,
  }));
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
  ctx.closePath();
  ctx.fillStyle = 'rgba(247,130,27,.18)';
  ctx.strokeStyle = '#F7821B'; ctx.lineWidth = 3;
  ctx.fill(); ctx.stroke();
  pts.forEach(p => {
    ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
    ctx.fillStyle = '#F7821B'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  });
}

function stopCamera() {
  if (camRAF) { cancelAnimationFrame(camRAF); camRAF = null; }
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  $('camVideo').srcObject = null;
}

$('camCancel').addEventListener('click', () => { stopCamera(); show('home'); refreshHome(); });

let camShooting = false;
$('camShoot').addEventListener('click', async () => {
  const v = $('camVideo');
  if (!v.videoWidth || camShooting) return;
  camShooting = true;
  // image du flux (toujours dispo) + cadre live que l'utilisateur a vu
  const frame = document.createElement('canvas');
  frame.width = v.videoWidth; frame.height = v.videoHeight;
  frame.getContext('2d').drawImage(v, 0, 0);
  const liveQuad = camLastQuad;
  const detScale = camDetScale;
  showLoader('Capture…');
  // vraie photo pleine résolution du capteur quand le navigateur le permet (Android)
  let photo = null;
  const track = camStream && camStream.getVideoTracks()[0];
  if (track && 'ImageCapture' in window) {
    try {
      const blob = await new ImageCapture(track).takePhoto();
      const bmp = await createImageBitmap(blob, { imageOrientation: 'from-image' });
      photo = bitmapToCanvas(bmp, MAX_SIDE);
      freeBitmap(bmp);
    } catch (err) { console.warn('takePhoto indisponible, image du flux', err); }
  }
  stopCamera();
  try {
    await ensureCv();
    showLoader('Détection des bords…');
    let base, corners;
    // la photo n'a pas forcément le cadrage du flux : on y refait la détection
    const qPhoto = photo ? detectScaled(photo) : null;
    if (qPhoto) {
      base = photo; corners = qPhoto;
    } else if (liveQuad) {
      // le live avait accroché : on réutilise ce que l'utilisateur a vu
      base = bitmapToCanvas(frame, MAX_SIDE);
      const s = base.width / frame.width;
      corners = liveQuad.map(p => ({ x: p.x * detScale * s, y: p.y * detScale * s }));
    } else {
      // rien d'accroché : meilleure image dispo + détection sur l'image figée
      base = photo || bitmapToCanvas(frame, MAX_SIDE);
      corners = detectCorners(base);
    }
    if (photo && base !== photo) releaseCanvas(photo);
    releaseCanvas(frame);
    hideLoader();
    openEditor({ base, corners, rotation: 0, filter: 'bw', darkness: 58, pageIndex: null });
  } catch (err) {
    console.error(err); hideLoader(); toast('Erreur de capture.');
    show('home'); refreshHome();
  } finally {
    camShooting = false;
  }
});

let _relayoutTimer = null;
window.addEventListener('resize', () => {
  if (camStream) resizeOverlay();
  // éditeur : l'image change de taille (rotation du téléphone…) -> on recale les poignées
  if (editState && !$('editor').classList.contains('hidden')) {
    clearTimeout(_relayoutTimer);
    _relayoutTimer = setTimeout(() => { if (editState && dragIndex < 0) layoutEditor(); }, 150);
  }
});

/* Charge un fichier image -> ImageBitmap avec orientation EXIF corrigée */
async function loadBitmap(file) {
  try {
    return await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (_) {
    // fallback : <img>
    return await new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = rej;
      img.src = URL.createObjectURL(file);
    });
  }
}

function bitmapToCanvas(bmp, maxSide) {
  let w = bmp.width, h = bmp.height;
  const scale = Math.min(1, maxSide / Math.max(w, h));
  w = Math.round(w * scale); h = Math.round(h * scale);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  return c;
}

/* ============================================================
   Détection des coins (OpenCV) — fallback marge par défaut
   ============================================================ */
function fallbackRect(W, H) {
  const m = 0.04;
  return [
    { x: W * m,       y: H * m },
    { x: W * (1 - m), y: H * m },
    { x: W * (1 - m), y: H * (1 - m) },
    { x: W * m,       y: H * (1 - m) },
  ];
}

/* aire d'un polygone (formule du lacet) */
function polyArea(p) {
  let a = 0;
  for (let i = 0; i < p.length; i++) {
    const j = (i + 1) % p.length;
    a += p[i].x * p[j].y - p[j].x * p[i].y;
  }
  return Math.abs(a) / 2;
}

/* d'un contour -> 4 coins : vrai quadrilatère si possible (perspective),
   sinon rectangle orienté minimal (redressement même si la forme est irrégulière) */
function quadFromContour(cnt) {
  const hull = new cv.Mat();
  cv.convexHull(cnt, hull);
  const peri = cv.arcLength(hull, true);
  let pts = null;
  for (const eps of [0.02, 0.03, 0.05, 0.07, 0.1]) {
    const ap = new cv.Mat();
    cv.approxPolyDP(hull, ap, eps * peri, true);
    if (ap.rows === 4) {
      pts = [];
      for (let i = 0; i < 4; i++) pts.push({ x: ap.data32S[i * 2], y: ap.data32S[i * 2 + 1] });
    }
    ap.delete();
    if (pts) break;
  }
  hull.delete();
  if (pts) return pts;
  // dernier recours : rectangle orienté minimal
  const r = cv.minAreaRect(cnt);
  const cx = r.center.x, cy = r.center.y, w = r.size.width, h = r.size.height;
  const a = r.angle * Math.PI / 180, cos = Math.cos(a), sin = Math.sin(a);
  return [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([ox, oy]) => ({
    x: cx + (ox * w / 2) * cos - (oy * h / 2) * sin,
    y: cy + (ox * w / 2) * sin + (oy * h / 2) * cos,
  }));
}

/* renvoie le quadrilatère détecté (ordonné TL,TR,BR,BL) ou null si rien de fiable.
   Méthode A (prioritaire) : Otsu + fermeture morphologique pour feuille claire sur fond sombre.
   Méthode B (secours)     : Canny à seuils adaptatifs calculés depuis la médiane des pixels. */
function detectQuad(canvas) {
  if (!cvReady) return null;
  const W = canvas.width, H = canvas.height;
  const minArea = W * H * 0.20;
  const maxArea = W * H * 0.95;   // rejette le fond entier pris pour un document
  const trash = [];
  const M = (m) => { trash.push(m); return m; };

  /* extrait le meilleur quad 4-sommets convexe depuis un masque binaire */
  function bestQuadFromMask(mask) {
    const contours = new cv.MatVector();
    const hier = M(new cv.Mat());
    cv.findContours(mask, contours, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
    let best = null, bestA = minArea;
    for (let i = 0; i < contours.size(); i++) {
      const cnt = contours.get(i);
      const area = Math.abs(cv.contourArea(cnt));
      if (area > bestA && area < maxArea) {
        const peri = cv.arcLength(cnt, true);
        const approx = new cv.Mat();
        cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
        if (approx.rows === 4 && cv.isContourConvex(approx)) {
          const pts = [];
          for (let j = 0; j < 4; j++)
            pts.push({ x: approx.data32S[j * 2], y: approx.data32S[j * 2 + 1] });
          const qa = polyArea(pts);
          if (qa > bestA && qa < maxArea) { best = pts; bestA = qa; }
        }
        approx.delete();
      }
      cnt.delete();
    }
    contours.delete();
    return best;
  }

  try {
    const src = M(cv.imread(canvas));
    const gray = M(new cv.Mat());
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0);

    // Méthode A : Otsu + fermeture 7×7 (bouche les trous dus au texte / QR codes)
    const kA = M(cv.Mat.ones(7, 7, cv.CV_8U));
    const thA = M(new cv.Mat());
    cv.threshold(gray, thA, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);
    const closedA = M(new cv.Mat());
    cv.morphologyEx(thA, closedA, cv.MORPH_CLOSE, kA);
    let best = bestQuadFromMask(closedA);

    // Méthode A-bis : polarité inverse (document sombre sur fond clair)
    if (!best) {
      const thAi = M(new cv.Mat());
      cv.threshold(gray, thAi, 0, 255, cv.THRESH_BINARY_INV + cv.THRESH_OTSU);
      const closedAi = M(new cv.Mat());
      cv.morphologyEx(thAi, closedAi, cv.MORPH_CLOSE, kA);
      best = bestQuadFromMask(closedAi);
    }

    // Méthode B : Canny à seuils adaptatifs (médiane pixels)
    if (!best) {
      const data = gray.data;
      const step = Math.max(1, Math.floor(data.length / 1000));
      const sample = [];
      for (let i = 0; i < data.length; i += step) sample.push(data[i]);
      sample.sort((a, b) => a - b);
      const med = sample[Math.floor(sample.length / 2)];
      const lo = Math.max(0, 0.66 * med), hi = Math.min(255, 1.33 * med);
      const edges = M(new cv.Mat());
      cv.Canny(gray, edges, lo, hi);
      const kB = M(cv.Mat.ones(5, 5, cv.CV_8U));
      cv.dilate(edges, edges, kB);
      best = bestQuadFromMask(edges);
    }

    return best ? orderCorners(best) : null;
  } catch (err) {
    console.warn('Détection échouée', err);
    return null;
  } finally {
    trash.forEach((t) => { try { if (t) t.delete(); } catch (_) {} });
  }
}

/* détection sur une copie réduite (rapide, et les réglages de detectQuad sont
   calibrés pour des images de quelques centaines de px), puis remise à l'échelle */
function detectScaled(canvas) {
  const s = Math.min(1, DETECT_SIDE / Math.max(canvas.width, canvas.height));
  if (s === 1) return detectQuad(canvas);
  const small = document.createElement('canvas');
  small.width = Math.round(canvas.width * s); small.height = Math.round(canvas.height * s);
  small.getContext('2d').drawImage(canvas, 0, 0, small.width, small.height);
  const q = detectQuad(small);
  const kx = canvas.width / small.width, ky = canvas.height / small.height;
  releaseCanvas(small);
  return q ? q.map(p => ({ x: p.x * kx, y: p.y * ky })) : null;
}

function detectCorners(canvas) {
  return detectScaled(canvas) || fallbackRect(canvas.width, canvas.height);
}

/* ordonne les coins : TL, TR, BR, BL */
function orderCorners(pts) {
  const bySum = [...pts].sort((a, b) => (a.x + a.y) - (b.x + b.y));
  const tl = bySum[0], br = bySum[3];
  const byDiff = [...pts].sort((a, b) => (a.y - a.x) - (b.y - b.x));
  const tr = byDiff[0], bl = byDiff[3];
  return [tl, tr, br, bl];
}

/* ============================================================
   ÉDITEUR
   ============================================================ */
const DISPLAY_MAX = 1; // ratio géré par CSS, on stocke l'échelle
let dragIndex = -1;

let livePreview = localStorage.getItem('scanLivePreview') === '1';

function openEditor(state) {
  closeEditor();
  editState = state;
  if (typeof editState.darkness !== 'number') editState.darkness = 50;
  show('editor');
  $('livePreviewToggle').checked = livePreview;
  updateFilterUI();
  renderEditorImage(true);
}

/* libère le Mat de normalisation N&B mis en cache sur un editState */
function clearNormCache(state) {
  if (state && state._normMat) { state._normMat.delete(); state._normMat = null; }
}

/* canvas source tourné, mis en cache par angle (évite une copie pleine
   résolution à chaque affichage) */
function editRotated(st) {
  const deg = ((st.rotation % 360) + 360) % 360;
  if (st._rc && st._rcDeg === deg) return st._rc;
  if (st._rc && st._rc !== st.base) releaseCanvas(st._rc);
  st._rc = rotatedCanvas(st.base, deg);
  st._rcDeg = deg;
  return st._rc;
}

/* ferme l'éditeur en libérant sa mémoire (Mat OpenCV + canvas pleine résolution) */
function closeEditor() {
  if (editState) {
    clearNormCache(editState);
    if (editState._rc && editState._rc !== editState.base) releaseCanvas(editState._rc);
    releaseCanvas(editState.base);
  }
  editState = null;
}

/* image affichée dans l'éditeur : brute, ou filtrée en direct si aperçu actif.
   Le N&B est coûteux : on cache la normalisation de fond (bwComputeNorm) par
   rotation et on ne refait que la courbe de niveaux (bwApplyLevels) à chaque
   geste du curseur de noirceur, sinon le slider rame. */
function buildDisplayCanvas() {
  const rc = editRotated(editState);
  // copie réduite pour l'affichage (la loupe, elle, lit la pleine résolution)
  const maxSide = livePreview ? 1100 : 1800;
  const scale = Math.min(1, maxSide / Math.max(rc.width, rc.height));
  const pc = document.createElement('canvas');
  pc.width = Math.round(rc.width * scale);
  pc.height = Math.round(rc.height * scale);
  pc.getContext('2d').drawImage(rc, 0, 0, pc.width, pc.height);
  if (!livePreview) return pc;

  if (editState.filter === 'bw' && cvReady) {
    if (!editState._normMat || editState._normRotation !== editState.rotation) {
      clearNormCache(editState);
      editState._normMat = bwComputeNorm(pc);
      editState._normRotation = editState.rotation;
    }
    const out = bwApplyLevels(editState._normMat, pc.width, pc.height, editState.darkness);
    releaseCanvas(pc);
    return out;
  }
  return applyFilter(pc, editState.filter, editState.darkness);
}

let _previewPending = false;
function renderEditorImage(relayout) {
  const img = $('editImg');
  const disp = buildDisplayCanvas();
  img.onload = relayout ? (() => { if (editState) layoutEditor(); }) : null;
  img.src = disp.toDataURL('image/jpeg', 0.85);
  if (disp !== editState._rc && disp !== editState.base) releaseCanvas(disp);
}
function schedulePreview() {
  if (!livePreview || _previewPending) return;
  _previewPending = true;
  requestAnimationFrame(() => { _previewPending = false; if (editState) renderEditorImage(false); });
}

/* reflète editState.filter dans les chips + affiche le curseur si N&B */
function updateFilterUI() {
  document.querySelectorAll('.chip').forEach(c =>
    c.classList.toggle('active', c.dataset.filter === editState.filter));
  $('darknessRow').classList.toggle('show', editState.filter === 'bw');
  $('darknessSlider').value = editState.darkness;
}

async function openEditorForPage(i) {
  // ré-édition : on repart de la photo source (gardée en JPEG, pas en canvas)
  const p = pages[i];
  if (!p) return;
  showLoader('Ouverture…');
  try {
    const bmp = await createImageBitmap(p.baseBlob);
    const base = bitmapToCanvas(bmp, MAX_SIDE);
    freeBitmap(bmp);
    openEditor({
      base, baseBlob: p.baseBlob, corners: p.corners.map(q => ({ ...q })),
      rotation: p.rotation, filter: p.filter, darkness: p.darkness, pageIndex: i,
    });
  } catch (err) {
    console.error(err); toast('Impossible de rouvrir cette page.');
  } finally {
    hideLoader();
  }
}

function rotatedCanvas(canvas, deg) {
  deg = ((deg % 360) + 360) % 360;
  if (deg === 0) return canvas;
  const c = document.createElement('canvas');
  const swap = (deg === 90 || deg === 270);
  c.width = swap ? canvas.height : canvas.width;
  c.height = swap ? canvas.width : canvas.height;
  const ctx = c.getContext('2d');
  ctx.translate(c.width / 2, c.height / 2);
  ctx.rotate(deg * Math.PI / 180);
  ctx.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
  return c;
}

/* coordonnées des coins après rotation visuelle */
function rotateCorners(corners, baseW, baseH, deg) {
  deg = ((deg % 360) + 360) % 360;
  return corners.map(p => {
    if (deg === 0)   return { x: p.x,          y: p.y };
    if (deg === 90)  return { x: baseH - p.y,  y: p.x };
    if (deg === 180) return { x: baseW - p.x,  y: baseH - p.y };
    return { x: p.y, y: baseW - p.x }; // 270
  });
}

function layoutEditor() {
  const img = $('editImg');
  const svg = $('editSvg');
  const wrap = $('canvasWrap');
  // position/taille RÉELLES de l'image à l'écran (repère fiable, anti-décalage)
  const wr = wrap.getBoundingClientRect();
  const ir = img.getBoundingClientRect();
  const dispW = ir.width, dispH = ir.height;
  if (!dispW || !dispH) return;   // image pas encore à l'écran
  // le SVG est posé EXACTEMENT sur l'image
  svg.style.left = (ir.left - wr.left) + 'px';
  svg.style.top = (ir.top - wr.top) + 'px';
  svg.style.width = dispW + 'px';
  svg.style.height = dispH + 'px';
  svg.setAttribute('viewBox', `0 0 ${dispW} ${dispH}`);

  // canvas source affiché (après rotation) + facteur d'échelle
  const rc = editRotated(editState);
  const sx = dispW / rc.width, sy = dispH / rc.height;
  const cornersRot = rotateCorners(editState.corners, editState.base.width, editState.base.height, editState.rotation);
  editState._disp = cornersRot.map(p => ({ x: p.x * sx, y: p.y * sy }));
  editState._scale = { sx, sy, srcW: rc.width, srcH: rc.height, dispW, dispH };
  drawEditor();
}

function drawEditor() {
  const svg = $('editSvg');
  const c = editState._disp;
  svg.innerHTML = '';
  const ns = 'http://www.w3.org/2000/svg';
  // polygone
  const poly = document.createElementNS(ns, 'polygon');
  poly.setAttribute('points', c.map(p => `${p.x},${p.y}`).join(' '));
  poly.setAttribute('class', 'edge');
  svg.appendChild(poly);
  // poignées : grosse zone tactile invisible + pastille visible
  c.forEach((p, i) => {
    const hit = document.createElementNS(ns, 'circle');
    hit.setAttribute('cx', p.x); hit.setAttribute('cy', p.y);
    hit.setAttribute('r', 30); hit.setAttribute('class', 'hit');
    svg.appendChild(hit);
    const circ = document.createElementNS(ns, 'circle');
    circ.setAttribute('cx', p.x); circ.setAttribute('cy', p.y);
    circ.setAttribute('r', 11); circ.setAttribute('class', 'corner');
    svg.appendChild(circ);
  });
}

/* loupe : zoom autour de la poignée en cours, pour viser précis */
function updateLoupe(idx) {
  const lp = $('loupe');
  if (idx < 0) { lp.classList.remove('show'); return; }
  const p = editState._disp[idx];
  const { sx, sy } = editState._scale;
  const rc = editState._rc;
  const cx = p.x / sx, cy = p.y / sy;      // centre dans le canvas source
  const zoom = 2.6, R = lp.width;
  const srcR = (R / zoom) / 2;
  const ctx = lp.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, R, R);
  ctx.save();
  ctx.beginPath(); ctx.arc(R / 2, R / 2, R / 2, 0, Math.PI * 2); ctx.clip();
  ctx.drawImage(rc, cx - srcR, cy - srcR, srcR * 2, srcR * 2, 0, 0, R, R);
  // réticule
  ctx.strokeStyle = 'rgba(247,130,27,.95)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(R / 2 - 14, R / 2); ctx.lineTo(R / 2 + 14, R / 2);
  ctx.moveTo(R / 2, R / 2 - 14); ctx.lineTo(R / 2, R / 2 + 14);
  ctx.stroke();
  ctx.restore();
  lp.classList.add('show');
}

/* drag des poignées (tactile + souris) — repère ancré sur l'image */
let dragOffset = { x: 0, y: 0 };
function pointerPos(e) {
  const r = $('editSvg').getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}
function nearestCorner(pos) {
  let idx = -1, min = 44 * 44;
  editState._disp.forEach((p, i) => {
    const d = (p.x - pos.x) ** 2 + (p.y - pos.y) ** 2;
    if (d < min) { min = d; idx = i; }
  });
  return idx;
}
function startDrag(e) {
  if (!editState || !editState._disp) return;
  const pos = pointerPos(e);
  dragIndex = nearestCorner(pos);
  if (dragIndex >= 0) {
    e.preventDefault();
    const c = editState._disp[dragIndex];
    dragOffset = { x: c.x - pos.x, y: c.y - pos.y }; // prise sans saut
    updateLoupe(dragIndex);
  }
}
function moveDrag(e) {
  if (dragIndex < 0) return;
  e.preventDefault();
  const pos = pointerPos(e);
  const { dispW, dispH } = editState._scale;
  const d = editState._disp;
  d[dragIndex].x = Math.max(0, Math.min(dispW, pos.x + dragOffset.x));
  d[dragIndex].y = Math.max(0, Math.min(dispH, pos.y + dragOffset.y));
  drawEditor();
  updateLoupe(dragIndex);
}
function endDrag() {
  if (dragIndex >= 0) {
    editState.corners = dispToSource(editState); // on fige les coins (survit aux rotations)
    updateLoupe(-1);
  }
  dragIndex = -1;
}

const wrap = $('canvasWrap');
wrap.addEventListener('touchstart', startDrag, { passive: false });
wrap.addEventListener('touchmove', moveDrag, { passive: false });
wrap.addEventListener('touchend', endDrag);
wrap.addEventListener('mousedown', startDrag);
window.addEventListener('mousemove', moveDrag);
window.addEventListener('mouseup', endDrag);

/* boutons éditeur */
$('rotL').addEventListener('click', () => { editState.rotation -= 90; reopenEditorImg(); });
$('rotR').addEventListener('click', () => { editState.rotation += 90; reopenEditorImg(); });
$('resetCorners').addEventListener('click', () => {
  if (!editState) return;
  // marges symétriques : même rectangle quelle que soit la rotation
  editState.corners = fallbackRect(editState.base.width, editState.base.height);
  if (editState._scale) layoutEditor();
});
function reopenEditorImg() {
  renderEditorImage(true);
}

/* filtres */
document.querySelectorAll('.chip').forEach(ch => {
  ch.addEventListener('click', () => {
    editState.filter = ch.dataset.filter;

/* curseur de noirceur (N&B) */
$('darknessSlider').addEventListener('input', (e) => {

/* interrupteur aperçu live (mémorisé) */

/* annuler / supprimer */
$('editCancel').addEventListener('click', () => {

/* valider */
$('editDone').addEventListener('click', async () => {
  if (!editState) return;
  const st = editState;
  showLoader('Application…');
  try {
    await ensureCv('Application…');
    await new Promise(r => setTimeout(r, 30));
    const result = renderPage(st);
    // stockage compact : JPEG (≈ 1-2 Mo) au lieu de canvas (≈ 30 Mo) par page
    const blob = await canvasToBlob(result, 0.92);
    const baseBlob = st.baseBlob || await canvasToBlob(st.base, 0.92);
    const pageData = {
      baseBlob, blob, url: URL.createObjectURL(blob),

      rotation: st.rotation, filter: st.filter, darkness: st.darkness,
    };
    releaseCanvas(result);
    let idx;
    if (st.pageIndex !== null) { idx = st.pageIndex; freePage(pages[idx]); pages[idx] = pageData; }
    else { pages.push(pageData); idx = pages.length - 1; }

    hideLoader();
    refreshHome();
    openPageViewer(idx);   // après validation -> aperçu en grand
  } catch (err) {
    console.error(err); hideLoader(); toast('Erreur de traitement.');
  }
});

/* convertit les coins affichés -> coords source d'origine (avant rotation) */
function dispToSource(st) {
  const { sx, sy } = st._scale;
  const rotPts = st._disp.map(p => ({ x: p.x / sx, y: p.y / sy }));
  // inverse de rotateCorners
  const deg = ((st.rotation % 360) + 360) % 360;
  const W = st.base.width, H = st.base.height;   // tourné de 90/270 : largeur = H, hauteur = W
  return rotPts.map(p => {
    if (deg === 0)   return { x: p.x, y: p.y };
    if (deg === 90)  return { x: p.y, y: H - p.x };
    if (deg === 180) return { x: W - p.x, y: H - p.y };
    return { x: W - p.y, y: p.x }; // 270
  });
}

/* ============================================================
   Rendu final d'une page : warp + filtre
   ============================================================ */
function renderPage(st) {
  // part des coins figés en coordonnées source : ne dépend pas de l'affichage
  // (plus de plantage si on valide avant que l'image soit à l'écran)
  const rc = editRotated(st);
  const corners = rotateCorners(st.corners, st.base.width, st.base.height, st.rotation);
  const [tl, tr, br, bl] = corners;
  const wTop = dist(tl, tr), wBot = dist(bl, br);
  const hL = dist(tl, bl), hR = dist(tr, br);
  let outW = Math.round(Math.max(wTop, wBot));
  let outH = Math.round(Math.max(hL, hR));
  outW = Math.max(50, outW); outH = Math.max(50, outH);

  let warped;
  if (cvReady) warped = warpCv(rc, corners, outW, outH);
  else warped = warpFallback(rc, corners, outW, outH);

  const out = applyFilter(warped, st.filter, st.darkness);
  if (out !== warped) releaseCanvas(warped);
  return out;
}
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function warpCv(canvas, c, outW, outH) {
  const src = cv.imread(canvas);
  const dst = new cv.Mat();
  const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [c[0].x, c[0].y, c[1].x, c[1].y, c[2].x, c[2].y, c[3].x, c[3].y]);
  const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, outW, 0, outW, outH, 0, outH]);
  const M = cv.getPerspectiveTransform(srcTri, dstTri);
  cv.warpPerspective(src, dst, M, new cv.Size(outW, outH), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar(255, 255, 255, 255));
  const out = document.createElement('canvas');
  out.width = outW; out.height = outH;
  cv.imshow(out, dst);
  src.delete(); dst.delete(); srcTri.delete(); dstTri.delete(); M.delete();
  return out;
}

/* fallback : simple crop à la bounding box (sans correction de perspective) */
function warpFallback(canvas, c, outW, outH) {
  const minX = Math.min(...c.map(p => p.x)), maxX = Math.max(...c.map(p => p.x));
  const minY = Math.min(...c.map(p => p.y)), maxY = Math.max(...c.map(p => p.y));
  const out = document.createElement('canvas');
  out.width = outW; out.height = outH;
  out.getContext('2d').drawImage(canvas, minX, minY, maxX - minX, maxY - minY, 0, 0, outW, outH);
  return out;
}

/* ============================================================
   Filtres
   ============================================================ */
function applyFilter(canvas, filter, darkness) {
  if (filter === 'color') return canvas;
  // N&B (défaut)
  if (cvReady) return bwCv(canvas, darkness);
  return grayJs(canvas, false); // repli si OpenCV non chargé
}

/* Étape LOURDE (à ne calculer qu'une fois par image) : normalisation du fond
   par division -> papier blanc uniforme, ombres/éclairage inégal effacés.
   Renvoie un cv.Mat à libérer par l'appelant. */
function bwComputeNorm(canvas) {
  const src = cv.imread(canvas);
  const gray = new cv.Mat();
  cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
  // débruitage : supprime le grain du papier/capteur -> fond lisse façon Genius,
  // en préservant les bords du texte (médian 3, sans étaler les fins traits).
  cv.medianBlur(gray, gray, 3);

  const maxBg = 1400;
  const scale = Math.min(1, maxBg / Math.max(gray.cols, gray.rows));
  const sw = Math.max(1, Math.round(gray.cols * scale));
  const sh = Math.max(1, Math.round(gray.rows * scale));
  const work = new cv.Mat();
  if (scale < 1) cv.resize(gray, work, new cv.Size(sw, sh), 0, 0, cv.INTER_AREA);
  else gray.copyTo(work);
  let ks = Math.round(Math.max(sw, sh) / 40); if (ks % 2 === 0) ks++; if (ks < 15) ks = 15;
  // noyau rectangulaire : séparable, ~20x plus rapide que l'ellipse, rendu identique
  const kernel = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(ks, ks));
  cv.morphologyEx(work, work, cv.MORPH_CLOSE, kernel);
  cv.GaussianBlur(work, work, new cv.Size(ks, ks), 0);
  const bg = new cv.Mat();
  if (scale < 1) cv.resize(work, bg, new cv.Size(gray.cols, gray.rows), 0, 0, cv.INTER_LINEAR);
  else work.copyTo(bg);
  work.delete(); kernel.delete();

  const norm = new cv.Mat();
  cv.divide(gray, bg, norm, 255);
  src.delete(); gray.delete(); bg.delete();
  return norm;
}

/* Étape LÉGÈRE (recalculée à chaque geste du curseur) : courbe de niveaux
   pilotée par darkness + léger renforcement de netteté. */
function bwApplyLevels(normMat, outWidth, outHeight, darkness) {
  const d = (typeof darkness === 'number') ? darkness : 50;
  const Bp = 75 + (d / 100) * 100;   // point noir : 75 -> 175
  const Wp = 215 - (d / 100) * 25;   // point blanc : 215 -> 190 (fond forcé blanc)
  const lut = new cv.Mat(1, 256, cv.CV_8U);
  const ld = lut.data;
  for (let i = 0; i < 256; i++) {
    let v = (i - Bp) / (Wp - Bp);
    v = v < 0 ? 0 : v > 1 ? 1 : v;
    ld[i] = Math.round(v * 255);
  }
  const out8 = new cv.Mat();
  cv.LUT(normMat, lut, out8);

  const blurS = new cv.Mat();
  cv.GaussianBlur(out8, blurS, new cv.Size(0, 0), 0.8);
  const sharp = new cv.Mat();
  cv.addWeighted(out8, 1.6, blurS, -0.6, 0, sharp);

  const out = document.createElement('canvas');
  out.width = outWidth; out.height = outHeight;
  cv.imshow(out, sharp);
  lut.delete(); out8.delete(); blurS.delete(); sharp.delete();
  return out;
}

/* N&B "document" facon Genius : combine les deux étapes (rendu final, one-shot). */
function bwCv(canvas, darkness) {
  const norm = bwComputeNorm(canvas);
  const out = bwApplyLevels(norm, canvas.width, canvas.height, darkness);
  norm.delete();
  return out;
}

/* gris pur, ou seuillage Otsu en JS si threshold=true */
function grayJs(canvas, threshold) {
  const ctx = canvas.getContext('2d');
  const im = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = im.data;
  const hist = new Array(256).fill(0);
  for (let i = 0; i < d.length; i += 4) {
    const g = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0;
    d[i] = d[i + 1] = d[i + 2] = g;
    hist[g]++;
  }
  if (threshold) {
    const total = canvas.width * canvas.height;
    let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
    let sumB = 0, wB = 0, max = 0, thr = 127;
    for (let i = 0; i < 256; i++) {
      wB += hist[i]; if (!wB) continue;
      const wF = total - wB; if (!wF) break;
      sumB += i * hist[i];
      const mB = sumB / wB, mF = (sum - sumB) / wF;
      const between = wB * wF * (mB - mF) ** 2;
      if (between > max) { max = between; thr = i; }
    }
    for (let i = 0; i < d.length; i += 4) {
      const v = d[i] > thr ? 255 : 0;
      d[i] = d[i + 1] = d[i + 2] = v;
    }
  }
  ctx.putImageData(im, 0, 0);
  return canvas;
}

/* ============================================================
   EXPORT (PDF / JPG) + partage natif
   ============================================================ */
$('exportBtn').addEventListener('click', openExportSheet);

function openExportSheet() {
  if (!pages.length) return;
  const bd = document.createElement('div');
  bd.className = 'sheet-backdrop';
  bd.innerHTML = `
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="grabber"></div>
      <h3>Exporter</h3>
      <div class="sub"><b>${pages.length}</b> page${pages.length > 1 ? 's' : ''} · choisis le format</div>
      <div class="format-row">
        <button id="expPdf">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          PDF
          <span class="hint">1 fichier, multi-pages</span>
        </button>
        <button id="expJpg">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
          Image
          <span class="hint">JPG · 1 par page</span>
        </button>
      </div>
      <button class="cancel" id="expCancel">Annuler</button>
    </div>`;
  bd.addEventListener('click', () => bd.remove());
  document.body.appendChild(bd);
  $('expCancel').addEventListener('click', () => bd.remove());
  $('expPdf').addEventListener('click', () => { bd.remove(); exportPDF(); });
  $('expJpg').addEventListener('click', () => { bd.remove(); exportJPG(); });
}

function dateStamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}-${p(d.getMonth() + 1)}-${d.getFullYear()}_${p(d.getHours())}h${p(d.getMinutes())}`;
}

async function exportPDF() {
  showLoader('Création du PDF…');
  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4' });
    const pageW = 210, pageH = 297, margin = 8;
    const maxW = pageW - margin * 2, maxH = pageH - margin * 2;
    for (let i = 0; i < pages.length; i++) {
      const p = pages[i];
      if (i > 0) pdf.addPage();
      const ratio = Math.min(maxW / p.w, maxH / p.h);
      const w = p.w * ratio, h = p.h * ratio;
      const x = (pageW - w) / 2, y = (pageH - h) / 2;
      // JPEG déjà encodé inséré tel quel : aucune recompression
      const bytes = new Uint8Array(await p.blob.arrayBuffer());
      pdf.addImage(bytes, 'JPEG', x, y, w, h);
    }
    const name = `Scan_${dateStamp()}.pdf`;
    const blob = pdf.output('blob');
    const shared = await shareOrDownload(blob, name, 'application/pdf');
    if (shared) { show('home'); refreshHome(); }
  } catch (err) {
    console.error(err); toast('Erreur PDF.');
  } finally { hideLoader(); }
}

async function exportJPG() {
  showLoader('Préparation…');
  try {
    const stamp = dateStamp();
    const files = pages.map((p, i) => {
      const suffix = pages.length > 1 ? `_${i + 1}` : '';
      return new File([p.blob], `Scan_${stamp}${suffix}.jpg`, { type: 'image/jpeg' });
    });
    if (navigator.canShare && navigator.canShare({ files })) {
      hideLoader();
      await navigator.share({ files });
      show('home'); refreshHome();
    } else {
      // pas de partage multi-fichiers : on télécharge chacun
      hideLoader();
      files.forEach(f => downloadFile(f, f.name));
      toast('Images téléchargées.');
      show('home'); refreshHome();
    }
  } catch (err) {
    if (err && err.name === 'AbortError') { hideLoader(); return; }
    console.error(err); hideLoader(); toast('Erreur image.');
  }
}

/* Retourne true si le fichier a été partagé/téléchargé, false si l'utilisateur a annulé. */
async function shareOrDownload(blob, name, type) {
  const file = new File([blob], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return true; }
    catch (err) { if (err && err.name === 'AbortError') return false; }
  }
  downloadFile(blob, name);
  toast('Fichier téléchargé.');
  return true;
}

function downloadFile(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/* ============================================================
   PWA (manifest injecté à la volée)
   ============================================================ */
(function injectManifest() {
  const icon = (sz) => {
    const c = document.createElement('canvas');
    c.width = c.height = sz;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#F7821B'; ctx.fillRect(0, 0, sz, sz);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = sz * 0.06; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const m = sz * 0.28, q = sz * 0.12;
    ctx.beginPath();
    ctx.moveTo(m, m + q); ctx.lineTo(m, m); ctx.lineTo(m + q, m); // TL
    ctx.moveTo(sz - m - q, m); ctx.lineTo(sz - m, m); ctx.lineTo(sz - m, m + q); // TR
    ctx.moveTo(sz - m, sz - m - q); ctx.lineTo(sz - m, sz - m); ctx.lineTo(sz - m - q, sz - m); // BR
    ctx.moveTo(m + q, sz - m); ctx.lineTo(m, sz - m); ctx.lineTo(m, sz - m - q); // BL
    ctx.stroke();
    return c.toDataURL('image/png');
  };
  const manifest = {
    name: 'Scanner', short_name: 'Scanner',
    start_url: '.', display: 'standalone',
    background_color: '#ffffff', theme_color: '#ffffff',
    icons: [
      { src: icon(192), sizes: '192x192', type: 'image/png' },
      { src: icon(512), sizes: '512x512', type: 'image/png' },
    ],
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const link = document.createElement('link');
  link.rel = 'manifest'; link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
  // icône Apple
  const apple = document.createElement('link');
  apple.rel = 'apple-touch-icon'; apple.href = icon(180);
  document.head.appendChild(apple);
})();

refreshHome();

/* service worker : garde le moteur (11 Mo) en cache -> lancement instantané, hors ligne */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker', err));
  });
}
