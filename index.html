<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scanner">
<meta name="theme-color" content="#ffffff">
<title>Scanner</title>
<style>
  :root {
    --accent: #F7821B;          /* orange Genius */
    --accent-dark: #E0700C;
    --bg: #FFFFFF;
    --bg-grouped: #F2F2F7;      /* gris iOS */
    --card: #FFFFFF;
    --editor-bg: #1C1C1E;       /* fond sombre éditeur */
    --text: #1C1C1E;
    --text-2: #8E8E93;
    --sep: #E5E5EA;
    --radius: 14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  /* retour visuel immédiat au toucher (pas d'attente du relâcher) */
  button { transition: transform .1s ease-out, opacity .1s ease-out; touch-action: manipulation; }
  button:active { transform: scale(.96); opacity: .85; }
  /* action principale d'un écran : en bas, à portée du pouce */
  .primary-btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; height: 50px; border-radius: 14px;
    background: var(--accent); color: #fff; font-size: 17px; font-weight: 600;
  }
  .primary-btn svg { width: 22px; height: 22px; }
  .cta { flex-shrink: 0; padding: 6px 16px calc(var(--safe-bottom) + 10px); }
  .hidden { display: none !important; }

  /* ---------- Écran générique ---------- */
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    background: var(--bg);
  }

  /* ---------- Barre de titre ---------- */
  .topbar {
    padding-top: calc(var(--safe-top) + 8px);
    height: calc(var(--safe-top) + 52px);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    flex-shrink: 0;
    border-bottom: 1px solid var(--sep);
    background: var(--bg);
  }
  .topbar.dark { background: var(--editor-bg); border-bottom: none; color: #fff; }
  .topbar .title { font-size: 17px; font-weight: 600; }
  .topbar .left, .topbar .right {
    position: absolute; top: calc(var(--safe-top) + 8px); height: 44px;
    display: flex; align-items: center; gap: 14px;
  }
  .topbar .left { left: 12px; }
  .topbar .right { right: 12px; }
  .iconbtn {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent);
  }
  .topbar.dark .iconbtn { color: #fff; background: rgba(255,255,255,.12); }
  .iconbtn svg { width: 24px; height: 24px; }

  /* ---------- HOME ---------- */
  #home .content {
    flex: 1; display: flex; flex-direction: column;
    overflow-y: auto;
  }
  /* état vide */
  .empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 32px; gap: 14px; color: var(--text-2);
  }
  .empty .doc-icon { color: var(--sep); }
  .empty .doc-icon svg { width: 76px; height: 76px; }
  .empty h2 { color: var(--text); font-size: 20px; font-weight: 600; margin: 0; }
  .empty p { margin: 0; font-size: 15px; max-width: 260px; line-height: 1.4; }

  /* galerie de pages */
  .gallery {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 14px; padding: 16px;
  }
  .page-card {
    background: var(--card); border-radius: var(--radius);
    overflow: hidden; position: relative;
    box-shadow: 0 1px 4px rgba(0,0,0,.10);
    aspect-ratio: 3/4;
  }
  .page-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .page-card .num {
    position: absolute; top: 8px; left: 8px;
    background: rgba(0,0,0,.6); color: #fff;
    font-size: 12px; font-weight: 600;
    padding: 2px 8px; border-radius: 20px;
  }

  /* ---------- Barre d'action du bas (home) ---------- */
  .bottombar {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-around;
    padding: 10px 12px calc(var(--safe-bottom) + 10px);
    border-top: 1px solid var(--sep);
    background: var(--bg);
  }
  .bottombar { gap: 12px; }
  .bottombar #addPagesBtn {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 11px; color: var(--text-2); min-width: 64px; height: 50px;
  }
  .bottombar #addPagesBtn svg { width: 26px; height: 26px; }
  .bottombar .primary-btn { flex: 1; width: auto; }

  /* FAB scanner (état vide) */
  .fab {
    position: fixed; bottom: calc(var(--safe-bottom) + 24px); left: 50%; transform: translateX(-50%);
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(247,130,27,.45);
  }
  .fab:active { transform: translateX(-50%) scale(.94); }
  .fab svg { width: 32px; height: 32px; }

  /* ---------- ÉDITEUR ---------- */
  #editor { background: var(--editor-bg); }
  #editor .canvas-wrap {
    flex: 1; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  #editImg { display: block; max-width: 100%; max-height: 100%; }
  #editSvg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .corner {
    fill: var(--accent); stroke: #fff; stroke-width: 2;
  }
  .hit { fill: transparent; }
  .edge { stroke: var(--accent); stroke-width: 2.5; fill: rgba(247,130,27,.12); }

  /* loupe (zoom au doigt) */
  #loupe {
    position: absolute; top: 14px; left: 14px;
    width: 92px; height: 92px; border-radius: 50%;
    border: 3px solid #fff; box-shadow: 0 2px 12px rgba(0,0,0,.55);
    display: none; z-index: 6; background: #000; pointer-events: none;
  }
  #loupe.show { display: block; }

  /* barre interrupteur aperçu */
  .preview-bar {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px 4px; background: var(--editor-bg); color: #c8c8c8; font-size: 13px; gap: 12px;
  }
  .switch { position: relative; display: inline-block; width: 46px; height: 28px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0; background: #4a4a4c; border-radius: 28px;
    transition: background .2s;
  }
  .switch .track::before {
    content: ''; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px;
    background: #fff; border-radius: 50%; transition: transform .2s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::before { transform: translateX(18px); }

  /* curseur de noirceur */
  .darkness {
    flex-shrink: 0; display: none; align-items: center; gap: 12px;
    padding: 8px 18px 2px; background: var(--editor-bg); color: #9a9a9a; font-size: 11px;
  }
  .darkness.show { display: flex; }
  .darkness input { flex: 1; accent-color: var(--accent); height: 26px; }

  /* filtres */

  /* outils éditeur */
  .edit-tools {
    flex-shrink: 0; display: flex; justify-content: space-around;
    padding: 6px 12px 2px;
    background: var(--editor-bg);
  }
  .edit-tools button {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    color: #fff; font-size: 11px; min-width: 64px; min-height: 50px;
  }
  .edit-tools button svg { width: 24px; height: 24px; }
  .edit-tools button.danger { color: #FF453A; }

  /* ---------- APERÇU GRAND FORMAT ---------- */
  #viewer { background: var(--editor-bg); }
  .viewer-body {
    flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
    overflow: hidden; padding: 10px;
  }
  #viewerImg {
    max-width: 100%; max-height: 100%; object-fit: contain;
    box-shadow: 0 4px 24px rgba(0,0,0,.5); background: #fff;
  }
  .viewer-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,.14); color: #fff;
    display: flex; align-items: center; justify-content: center; z-index: 2;
  }
  .viewer-nav svg { width: 26px; height: 26px; }
  #viewerPrev { left: 8px; } #viewerNext { right: 8px; }
  .viewer-nav.hidden { display: none; }
  .viewer-nav:active { transform: translateY(-50%) scale(.92); }
  #viewerBody { touch-action: pan-y; }

  /* source et résolution de la photo, sous le titre de l'éditeur */
  .cap-info { display: block; font-size: 11px; font-weight: 400; color: #9a9a9a; text-align: center; }
  .cap-info:empty { display: none; }

  /* ---------- Feuille d'export ---------- */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.4);
    display: flex; align-items: flex-end; z-index: 50;
    animation: fade .2s ease;
  }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  .sheet {
    width: 100%; background: var(--bg-grouped);
    border-radius: 18px 18px 0 0;
    padding: 8px 16px calc(var(--safe-bottom) + 16px);
    animation: slideup .25s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes slideup { from { transform: translateY(100%) } to { transform: translateY(0) } }
  /* réglage iPhone « Réduire les animations » : fondus au lieu des glissements */
  @media (prefers-reduced-motion: reduce) {
    .sheet { animation: fade .2s ease; }
    button, button:active { transition: none; transform: none; }
    .fab, .fab:active { transform: translateX(-50%); }
    .viewer-nav, .viewer-nav:active { transform: translateY(-50%); }
  }
  .sheet .grabber { width: 38px; height: 5px; border-radius: 3px; background: #C7C7CC; margin: 6px auto 14px; }
  .sheet h3 { text-align: center; margin: 0 0 4px; font-size: 17px; }
  .sheet .sub { text-align: center; color: var(--text-2); font-size: 13px; margin-bottom: 18px; }
  .sheet .sub b { color: var(--accent); }
  .format-row { display: flex; gap: 12px; margin-bottom: 12px; }
  .format-row button {
    flex: 1; min-width: 0; background: var(--card); border-radius: var(--radius);
    padding: 16px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .format-row button svg { width: 28px; height: 28px; color: var(--accent); }
  .format-row button .hint { font-size: 11px; font-weight: 400; color: var(--text-2); }
  .sheet .cancel {
    width: 100%; background: var(--card); border-radius: var(--radius);
    padding: 15px; font-size: 16px; font-weight: 600; color: var(--accent);
    margin-top: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }

  /* ---------- Overlay chargement ---------- */
  .loader {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.55); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  }
  .spinner {
    width: 42px; height: 42px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,.25); border-top-color: #fff;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg) } }
  .loader span { font-size: 15px; }

  /* toast */
  .toast {
    position: fixed; bottom: calc(var(--safe-bottom) + 90px); left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.85); color: #fff; padding: 11px 18px; border-radius: 22px;
    font-size: 14px; z-index: 200; max-width: 86%; text-align: center;
    animation: fade .2s ease;
  }
</style>
</head>

<!-- libs -->
<script src="jspdf.umd.min.js"></script>
<script>
/* ============================================================
   État global
   ============================================================ */
let cvReady = false;
let cvFailed = false;      // OpenCV introuvable (local + CDN) : mode dégradé
const pages = [];          // { baseBlob, blob (JPEG final), url, thumb, w, h, corners, rotation, darkness }
let editState = null;      // état de l'éditeur en cours
const MAX_SIDE = 3200;     // résolution max conservée (≈ 230 dpi sur un A4 plein cadre)
const DETECT_SIDE = 800;   // la détection des coins tourne sur une copie réduite

const $ = (id) => document.getElementById(id);

/* OpenCV chargé en différé (gros fichier ~10 Mo).
   Copie locale versionnée avec l'app (docs.opencv.org/4.x est un fichier
   mouvant qui peut casser l'app à distance) ; repli CDN si absente. */
function loadOpenCV(src, fallback) {
  const s = document.createElement('script');
  s.src = src;
  s.async = true;
  s.onload = () => {
    if (window.cv && cv.getBuildInformation) { cvReady = true; }
    else if (window.cv) { cv['onRuntimeInitialized'] = () => { cvReady = true; }; }
  };
  s.onerror = () => {
    if (fallback) { console.warn('OpenCV local absent, repli CDN'); loadOpenCV(fallback, null); }
    else { cvFailed = true; console.warn('OpenCV non chargé — mode dégradé'); }
  };
  document.body.appendChild(s);
}
loadOpenCV('opencv.js', 'https://docs.opencv.org/4.x/opencv.js');

/* attend le moteur OpenCV (sinon le scan serait dégradé sans prévenir) */
function whenCvReady(timeoutMs = 30000) {
  if (cvReady) return Promise.resolve(true);
  return new Promise(resolve => {
    const t0 = Date.now();
    const tick = () => {
      if (cvReady) resolve(true);
      else if (cvFailed || Date.now() - t0 > timeoutMs) resolve(false);
      else setTimeout(tick, 150);
    };
    tick();
  });
}
async function ensureCv(msgAfter) {
  if (cvReady) return true;
  showLoader('Chargement du moteur de scan…');
  const ok = await whenCvReady();
  if (!ok) toast('Moteur de scan indisponible : qualité réduite.');
  if (msgAfter) showLoader(msgAfter);
  return ok;
}

/* libère tout de suite la mémoire d'un canvas (Safari iOS la rend tard sinon) */
function releaseCanvas(c) { if (c) { c.width = 0; c.height = 0; } }
function freeBitmap(b) {
  if (!b) return;
  if (b.close) b.close();
  else if (b.src && b.src.startsWith('blob:')) URL.revokeObjectURL(b.src);
}
function canvasToBlob(c, q) {
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/jpeg', q));
}
/* vraie miniature (480 px) pour la galerie, pas l'image pleine résolution */
function makeThumb(c) {
  const s = Math.min(1, 480 / c.width);
  const t = document.createElement('canvas');
  t.width = Math.round(c.width * s); t.height = Math.round(c.height * s);
  t.getContext('2d').drawImage(c, 0, 0, t.width, t.height);
  const url = t.toDataURL('image/jpeg', 0.75);
  releaseCanvas(t);
  return url;
}
function freePage(p) { if (p && p.url) URL.revokeObjectURL(p.url); }

async function processImageFile(file, source) {
  if (!file) return;
  showLoader('Lecture de la photo…');
  try {
    const bmp = await loadBitmap(file);
    const info = source + ' ' + mpText(bmp.width * bmp.height / 1e6);
    const baseCanvas = bitmapToCanvas(bmp, MAX_SIDE);
    freeBitmap(bmp);
    await ensureCv();
    showLoader('Détection des bords…');
    const corners = detectCorners(baseCanvas);
    openEditor({ base: baseCanvas, corners, rotation: 0, darkness: 50, pageIndex: null, info });
  } catch (err) {
    console.error(err);
    toast('Impossible de lire cette image.');
  } finally {
    hideLoader();
  }
}

/* Charge un fichier image -> ImageBitmap avec orientation EXIF corrigée */
async function loadBitmap(file) {
  try {
    return await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (_) {
    // fallback : <img>
    return await new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = rej;
      img.src = URL.createObjectURL(file);
    });
  }
}

function bitmapToCanvas(bmp, maxSide) {
  let w = bmp.width, h = bmp.height;
  const scale = Math.min(1, maxSide / Math.max(w, h));
  w = Math.round(w * scale); h = Math.round(h * scale);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  return c;
}

/* ============================================================
   Détection des coins (OpenCV) — fallback marge par défaut
   ============================================================ */
function fallbackRect(W, H) {
  const m = 0.04;
  return [
    { x: W * m,       y: H * m },
    { x: W * (1 - m), y: H * m },
    { x: W * (1 - m), y: H * (1 - m) },
    { x: W * m,       y: H * (1 - m) },
  ];
}

/* ============================================================
   DÉTECTION DU DOCUMENT (v2)
   Principe : on ne fait plus confiance au premier masque venu.
   1) on fabrique BEAUCOUP de quadrilatères candidats (contours de plusieurs
      masques + combinaisons de droites de Hough) ;
   2) chaque candidat est noté sur des preuves : part de chaque côté réellement
      appuyée par un bord dans l'image (gradient, bon sens clair/sombre),
      côté collé au bord de l'image = aucune preuve, droites qui « traversent »
      (joint de carrelage, bord de table) pénalisées, forme plausible ;
   3) le meilleur est recalé au sous-pixel sur les bords, puis re-noté.
   Si rien n'est assez solide -> null (l'app affiche alors le cadre par défaut).
   ============================================================ */
const DET_WORK = 432;          // plus grand côté de l'image de travail (px)
const DET_MIN_AREA = 0.08;     // part mini de l'image occupée par le document
const DET_MAX_AREA = 0.97;
const DET_ANGLE_MIN = 60, DET_ANGLE_MAX = 120;   // angles intérieurs plausibles (°)
const DET_SIDE_RATIO = 2.0;    // rapport maxi entre côtés opposés
const DET_ACCEPT = 0.62;       // note mini pour accepter un quad
const DET_STRICT = 0.86;       // note exigée quand un côté se prolonge au-delà d'un coin

/* aire signée (> 0 si sens horaire à l'écran, y vers le bas) */
function quadSignedArea(q) {
  let a = 0;
  for (let i = 0; i < 4; i++) { const j = (i + 1) & 3; a += q[i].x * q[j].y - q[j].x * q[i].y; }
  return a / 2;
}

/* forme plausible ? (convexe, taille, angles, côtés opposés comparables) */
function quadPlausible(q, w, h) {
  const area = Math.abs(quadSignedArea(q));
  if (area < DET_MIN_AREA * w * h || area > DET_MAX_AREA * w * h) return false;
  const len = [];
  let sign = 0;
  for (let i = 0; i < 4; i++) {
    const a = q[i], b = q[(i + 1) & 3], c = q[(i + 2) & 3];
    // tolérance : un coin peut dépasser un peu du cadre (document au ras de l'image)
    if (a.x < -0.03 * w || a.x > 1.03 * w || a.y < -0.03 * h || a.y > 1.03 * h) return false;
    const ux = b.x - a.x, uy = b.y - a.y, vx = c.x - b.x, vy = c.y - b.y;
    const lu = Math.hypot(ux, uy), lv = Math.hypot(vx, vy);
    if (lu < 12 || lv < 12) return false;
    len.push(lu);
    const cr = ux * vy - uy * vx;
    if (cr === 0) return false;
    if (sign === 0) sign = cr > 0 ? 1 : -1; else if ((cr > 0 ? 1 : -1) !== sign) return false;   // non convexe
    const ang = Math.acos(Math.max(-1, Math.min(1, -(ux * vx + uy * vy) / (lu * lv)))) * 180 / Math.PI;
    if (ang < DET_ANGLE_MIN || ang > DET_ANGLE_MAX) return false;
  }
  const r1 = len[0] / len[2], r2 = len[1] / len[3];
  if (r1 > DET_SIDE_RATIO || r1 < 1 / DET_SIDE_RATIO || r2 > DET_SIDE_RATIO || r2 < 1 / DET_SIDE_RATIO) return false;
  return true;
}

/* Appuis d'un segment : on avance le long du segment (pas `step`) et, à chaque point, on
   cherche le pic de gradient le long de la normale (±R px), pour 4 « canaux » :
   0 = luminance croissante vers l'intérieur, 1 = décroissante, 2 / 3 = idem en couleur.
   Un point n'est « appuyé » que si ses voisins le long du segment ont leur pic au même
   endroit (à 1 px près) : un vrai bord est une LIGNE continue, alors que la texture
   (tissu, veinage du bois, motif) donne des pics épars.
   Écrit les bits (1, 2, 4, 8) dans G.bits à partir de `at` ; renvoie le nombre de points. */
function segmentBits(G, ax, ay, ux, uy, nx, ny, t0, t1, step, R, at) {
  const w = G.w, h = G.h, gx = G.gx, gy = G.gy, cx = G.cx, cy = G.cy, pk = G.pk, bits = G.bits;
  let n = 0;
  for (let t = t0; t <= t1 && at + n < bits.length; t += step, n++) {
    const px = ax + ux * t, py = ay + uy * t;
    let gmax = G.tG, gmin = -G.tG, cmax = G.tC, cmin = -G.tC, i0 = -9, i1 = -9, i2 = -9, i3 = -9;
    // un point posé sur le bord de l'image n'est appuyé par rien
    if (px >= 2 && py >= 2 && px <= w - 3 && py <= h - 3) {
      for (let k = -R; k <= R; k++) {
        const xi = Math.round(px + k * nx), yi = Math.round(py + k * ny);
        if (xi < 1 || yi < 1 || xi > w - 2 || yi > h - 2) continue;
        const o = yi * w + xi;
        const d = gx[o] * nx + gy[o] * ny, e = cx[o] * nx + cy[o] * ny;
        if (d > gmax) { gmax = d; i0 = k; } else if (d < gmin) { gmin = d; i1 = k; }
        if (e > cmax) { cmax = e; i2 = k; } else if (e < cmin) { cmin = e; i3 = k; }
      }
    }
    const o4 = n * 4;
    pk[o4] = i0; pk[o4 + 1] = i1; pk[o4 + 2] = i2; pk[o4 + 3] = i3;
  }
  for (let j = 0; j < n; j++) {
    let f = 0;
    for (let c = 0; c < 4; c++) {
      const v = pk[j * 4 + c];
      if (v === -9) continue;
      const okPrev = j === 0 || Math.abs(pk[(j - 1) * 4 + c] - v) <= 1;
      const okNext = j === n - 1 || Math.abs(pk[(j + 1) * 4 + c] - v) <= 1;
      if (okPrev && okNext && n > 1) f |= 1 << c;
    }
    bits[at + j] = f;
  }
  return n;
}

/* note un quad : part de chaque côté appuyée par un vrai bord.
   Renvoie { mean, min, sides[4], mask } */
function quadScore(q, G) {
  const cw = quadSignedArea(q) > 0 ? 1 : -1;
  const bits = G.bits, sideStart = [0, 0, 0, 0, 0];
  let n = 0;
  for (let i = 0; i < 4; i++) {
    const a = q[i], b = q[(i + 1) & 3];
    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
    const ux = dx / L, uy = dy / L;
    sideStart[i] = n;
    // normale vers l'intérieur ; on ignore 7 % à chaque bout (coins arrondis / cornés)
    n += segmentBits(G, a.x, a.y, ux, uy, -uy * cw, ux * cw, 0.07 * L, 0.93 * L, Math.max(2, L / 60), 3, n);
  }
  sideStart[4] = n;
  if (!n) return null;
  const tot = [0, 0, 0, 0];
  for (let j = 0; j < n; j++) { const f = bits[j]; if (f & 1) tot[0]++; if (f & 2) tot[1]++; if (f & 4) tot[2]++; if (f & 8) tot[3]++; }
  // un seul sens par canal pour tout le quad : la feuille est plus claire (ou plus
  // sombre) que ce qui l'entoure sur TOUS ses côtés
  const gbit = tot[0] >= tot[1] ? 1 : 2;
  const cbit = tot[2] >= tot[3] ? 4 : 8;
  const useC = Math.max(tot[2], tot[3]) > 0.3 * n;
  const mask = gbit | (useC ? cbit : 0);
  const sides = [];
  let mean = 0, min = 1;
  for (let i = 0; i < 4; i++) {
    let c = 0;
    const m = sideStart[i + 1] - sideStart[i];
    for (let j = sideStart[i]; j < sideStart[i + 1]; j++) if (bits[j] & mask) c++;
    const s = m ? c / m : 0;
    sides.push(s); mean += s / 4; if (s < min) min = s;
  }
  return { mean, min, sides, gbit, cbit, useC, mask };
}

/* prolongements des côtés au-delà des coins : s'ils sont encore appuyés par un bord,
   ce coin n'en est pas un (jonction en T). Un côté dont les DEUX voisins le traversent
   est une ligne intérieure (filet de tableau, jonction de deux tickets, limite d'ombre)
   ou un joint de carrelage : le quad est alors tronqué / faux.
   Renvoie { frac, crossed } */
function quadThrough(q, G, sc) {
  const w = G.w, h = G.h, bits = G.bits;
  const cw = quadSignedArea(q) > 0 ? 1 : -1;
  const len = [0, 1, 2, 3].map(i => Math.hypot(q[(i + 1) & 3].x - q[i].x, q[(i + 1) & 3].y - q[i].y));
  const endOK = [[false, false], [false, false], [false, false], [false, false]];
  let n = 0, c = 0;
  for (let i = 0; i < 4; i++) {
    const a = q[i], b = q[(i + 1) & 3], L = len[i];
    const ux = (b.x - a.x) / L, uy = (b.y - a.y) / L, nx = -uy * cw, ny = ux * cw;
    for (let e = 0; e < 2; e++) {
      // tolérance latérale : deux tickets empilés n'ont pas exactement la même largeur
      const rr = Math.min(6, Math.max(3, Math.round(0.05 * len[e ? (i + 1) & 3 : (i + 3) & 3])));
      // longueur utile du prolongement : jusqu'au bord de l'image au plus
      const ox = e ? b.x : a.x, oy = e ? b.y : a.y, sx = e ? ux : -ux, sy = e ? uy : -uy;
      let ext = Math.max(16, 0.2 * L);
      if (sx > 1e-6) ext = Math.min(ext, (w - 4 - ox) / sx); else if (sx < -1e-6) ext = Math.min(ext, (3 - ox) / sx);
      if (sy > 1e-6) ext = Math.min(ext, (h - 4 - oy) / sy); else if (sy < -1e-6) ext = Math.min(ext, (3 - oy) / sy);
      if (ext < 14) continue;
      const sn = segmentBits(G, ox, oy, sx, sy, nx, ny, 4, ext, 2, rr, 0);
      let scnt = 0;
      for (let j = 0; j < sn; j++) if (bits[j] & sc.mask) scnt++;
      n += sn; c += scnt;
      endOK[i][e] = sn >= 6 && scnt / sn >= 0.75;
    }
  }
  let crossed = 0;
  for (let i = 0; i < 4; i++) if (endOK[(i + 3) & 3][1] && endOK[(i + 1) & 3][0]) crossed++;
  let ends = 0;
  for (let i = 0; i < 4; i++) ends += (endOK[i][0] ? 1 : 0) + (endOK[i][1] ? 1 : 0);
  return { frac: n ? c / n : 0, crossed, ends };
}

/* recale chaque côté sur le bord réel (maximum du gradient le long de la normale),
   droite ajustée aux moindres carrés avec rejet des points aberrants */
function quadRefine(q, G, sc) {
  const w = G.w, h = G.h;
  const cw = quadSignedArea(q) > 0 ? 1 : -1;
  const lines = [];
  for (let i = 0; i < 4; i++) {
    const a = q[i], b = q[(i + 1) & 3];
    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
    const ux = dx / L, uy = dy / L, nx = -uy * cw, ny = ux * cw;
    const xs = [], ys = [];
    const val = (xi, yi) => {
      const o = yi * w + xi;
      let v = (sc.gbit === 1 ? 1 : -1) * (G.gx[o] * nx + G.gy[o] * ny) / G.tG;
      if (sc.useC) { const c = (sc.cbit === 4 ? 1 : -1) * (G.cx[o] * nx + G.cy[o] * ny) / G.tC; if (c > v) v = c; }
      return v;
    };
    for (let t = 0.06 * L; t <= 0.94 * L; t += 1.5) {
      const px = a.x + ux * t, py = a.y + uy * t;
      let best = 1, bk = null;
      const v = [];
      for (let k = -4; k <= 4; k++) {
        const xi = Math.round(px + k * nx), yi = Math.round(py + k * ny);
        v.push((xi < 1 || yi < 1 || xi > w - 2 || yi > h - 2) ? 0 : val(xi, yi));
      }
      for (let k = 1; k < 8; k++) if (v[k] > best) { best = v[k]; bk = k; }
      if (bk === null) continue;
      // sommet de parabole : position du bord au sous-pixel
      const den = v[bk - 1] - 2 * v[bk] + v[bk + 1];
      const sub = den < 0 ? Math.max(-0.5, Math.min(0.5, 0.5 * (v[bk - 1] - v[bk + 1]) / den)) : 0;
      const k = bk - 4 + sub;
      // les positions échantillonnées sont arrondies au pixel : on repart du pixel arrondi
      xs.push(px + k * nx); ys.push(py + k * ny);
    }
    let line = { px: a.x, py: a.y, ux, uy };
    if (xs.length >= Math.max(6, 0.3 * (0.88 * L / 1.5))) {
      let keep = xs.map(() => true);
      for (let it = 0; it < 3; it++) {
        let m = 0, sx = 0, sy = 0;
        for (let j = 0; j < xs.length; j++) if (keep[j]) { sx += xs[j]; sy += ys[j]; m++; }
        if (m < 5) break;
        sx /= m; sy /= m;
        let sxx = 0, sxy = 0, syy = 0;
        for (let j = 0; j < xs.length; j++) if (keep[j]) { const ex = xs[j] - sx, ey = ys[j] - sy; sxx += ex * ex; sxy += ex * ey; syy += ey * ey; }
        const th = 0.5 * Math.atan2(2 * sxy, sxx - syy);
        let lx = Math.cos(th), ly = Math.sin(th);
        if (lx * ux + ly * uy < 0) { lx = -lx; ly = -ly; }
        // garde-fou : la droite ajustée ne doit pas tourner de plus de ~8° par rapport au côté
        if (lx * ux + ly * uy < 0.99) break;
        line = { px: sx, py: sy, ux: lx, uy: ly };
        const tol = it === 0 ? 2.5 : 1.5;
        for (let j = 0; j < xs.length; j++) keep[j] = Math.abs((xs[j] - sx) * -ly + (ys[j] - sy) * lx) <= tol;
      }
    }
    lines.push(line);
  }
  const out = [];
  for (let i = 0; i < 4; i++) {
    const p = lineIntersect(lines[(i + 3) & 3], lines[i]);
    if (!p) return null;
    out.push(p);
  }
  return out;
}

/* intersection de deux droites { px, py, ux, uy } */
function lineIntersect(a, b) {
  const den = a.ux * b.uy - a.uy * b.ux;
  if (Math.abs(den) < 1e-6) return null;
  const t = ((b.px - a.px) * b.uy - (b.py - a.py) * b.ux) / den;
  return { x: a.px + a.ux * t, y: a.py + a.uy * t };
}

/* regroupe les segments de Hough alignés en droites { px, py, ux, uy, t0, t1, len } */
function mergeSegments(seg, nSeg, maxLines) {
  const order = [];
  for (let i = 0; i < nSeg; i++) order.push(i);
  const L = (i) => Math.hypot(seg[i * 4 + 2] - seg[i * 4], seg[i * 4 + 3] - seg[i * 4 + 1]);
  order.sort((a, b) => L(b) - L(a));
  const lines = [];
  for (const i of order) {
    const x1 = seg[i * 4], y1 = seg[i * 4 + 1], x2 = seg[i * 4 + 2], y2 = seg[i * 4 + 3];
    const len = Math.hypot(x2 - x1, y2 - y1);
    if (len < 1) continue;
    let hit = null;
    for (const ln of lines) {
      const d1 = (x1 - ln.px) * -ln.uy + (y1 - ln.py) * ln.ux, d2 = (x2 - ln.px) * -ln.uy + (y2 - ln.py) * ln.ux;
      if (Math.abs(d1) < 2.5 && Math.abs(d2) < 2.5 && Math.abs(d1 - d2) < 0.07 * len + 1.5) { hit = ln; break; }
    }
    if (hit) {
      const t1 = (x1 - hit.px) * hit.ux + (y1 - hit.py) * hit.uy, t2 = (x2 - hit.px) * hit.ux + (y2 - hit.py) * hit.uy;
      hit.t0 = Math.min(hit.t0, t1, t2); hit.t1 = Math.max(hit.t1, t1, t2); hit.len += len;
      hit.iv.push([Math.min(t1, t2), Math.max(t1, t2)]);
    } else {
      lines.push({ px: x1, py: y1, ux: (x2 - x1) / len, uy: (y2 - y1) / len, t0: 0, t1: len, len, iv: [[0, len]] });
    }
  }
  lines.sort((a, b) => b.len - a.len);
  return lines.slice(0, maxLines);
}

/* part du segment [ta, tb] (abscisses sur la droite) couverte par les segments de Hough */
function lineCover(ln, ta, tb) {
  if (ta > tb) { const s = ta; ta = tb; tb = s; }
  const L = tb - ta;
  if (L <= 0) return 0;
  let c = 0;
  for (const iv of ln.iv) { const lo = Math.max(ta, iv[0] - 2), hi = Math.min(tb, iv[1] + 2); if (hi > lo) c += hi - lo; }
  return Math.min(1, c / L);
}

/* candidats issus des droites : pour chaque paire de grandes droites « opposées »
   (les deux longs bords), on cherche les droites transversales qui les relient et on
   garde les plus extérieures de chaque côté (les lignes de texte / filets sont au milieu) */
function quadsFromLines(lines, w, h, maxOut) {
  const minSep = 0.12 * Math.min(w, h);
  const nMain = Math.min(lines.length, 18);
  const pairs = [];
  for (let i = 0; i < nMain; i++) for (let j = i + 1; j < nMain; j++) {
    const a = lines[i], b = lines[j];
    if (Math.abs(a.ux * b.uy - a.uy * b.ux) > 0.47) continue;      // > 28° : pas des côtés opposés
    const mx = b.px + b.ux * (b.t0 + b.t1) / 2, my = b.py + b.uy * (b.t0 + b.t1) / 2;
    if (Math.abs((mx - a.px) * -a.uy + (my - a.py) * a.ux) < minSep) continue;
    pairs.push({ a, b, len: a.len + b.len });
  }
  pairs.sort((p, q) => q.len - p.len);
  const out = [];
  const T = (ln, pt) => (pt.x - ln.px) * ln.ux + (pt.y - ln.py) * ln.uy;
  for (let p = 0; p < Math.min(pairs.length, 16) && out.length < maxOut; p++) {
    const A = pairs[p].a, B = pairs[p].b;
    const sg = A.ux * B.ux + A.uy * B.uy < 0 ? -1 : 1;
    let ax = A.ux + sg * B.ux, ay = A.uy + sg * B.uy;
    const al = Math.hypot(ax, ay); ax /= al; ay /= al;
    const tr = [];
    for (const C of lines) {
      if (C === A || C === B) continue;
      if (Math.abs(ax * C.uy - ay * C.ux) < 0.76) continue;        // < 50° avec l'axe : pas transversale
      const pa = lineIntersect(A, C), pb = lineIntersect(B, C);
      if (!pa || !pb) continue;
      if (lineCover(C, T(C, pa), T(C, pb)) < 0.4) continue;
      tr.push({ pa, pb, s: ((pa.x + pb.x) * ax + (pa.y + pb.y) * ay) / 2 });
    }
    if (tr.length < 2) continue;
    tr.sort((u, v) => u.s - v.s);
    const K = Math.min(4, tr.length - 1);
    for (let i = 0; i < K; i++) for (let j = tr.length - 1; j >= tr.length - K && j > i; j--) {
      if (tr[j].s - tr[i].s < minSep) continue;
      const q = [tr[i].pa, tr[i].pb, tr[j].pb, tr[j].pa];
      if (quadPlausible(q, w, h)) out.push(q);
    }
  }
  return out.slice(0, maxOut);
}

/* candidats issus des contours d'un masque binaire (régions claires ET sombres) */
function quadsFromMask(mask, w, h, out, M) {
  const contours = M(new cv.MatVector());
  const hier = M(new cv.Mat());
  cv.findContours(mask, contours, hier, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);
  const minA = DET_MIN_AREA * w * h * 0.8, maxA = DET_MAX_AREA * w * h;
  const nC = contours.size();
  for (let i = 0; i < nC; i++) {
    const cnt = contours.get(i);
    let hull = null;
    try {
      if (cnt.rows < 4) continue;
      const r = cv.boundingRect(cnt);
      if (r.width * r.height < minA) continue;
      hull = new cv.Mat();
      cv.convexHull(cnt, hull);
      const area = Math.abs(cv.contourArea(hull));
      if (area < minA || area > maxA) continue;
      const peri = cv.arcLength(hull, true);
      for (const eps of [0.015, 0.03, 0.06]) {
        const ap = new cv.Mat();
        try {
          cv.approxPolyDP(hull, ap, eps * peri, true);
          if (ap.rows === 4) {
            const q = [];
            for (let j = 0; j < 4; j++) q.push({ x: ap.data32S[j * 2], y: ap.data32S[j * 2 + 1] });
            if (quadPlausible(q, w, h)) out.push(q);
          }
        } finally { ap.delete(); }
      }
      // rectangle orienté minimal (feuille aux bords irréguliers / gondolés)
      const rr = cv.minAreaRect(hull);
      const a = rr.angle * Math.PI / 180, co = Math.cos(a), si = Math.sin(a);
      const q = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([ox, oy]) => ({
        x: rr.center.x + (ox * rr.size.width / 2) * co - (oy * rr.size.height / 2) * si,
        y: rr.center.y + (ox * rr.size.width / 2) * si + (oy * rr.size.height / 2) * co,
      }));
      if (quadPlausible(q, w, h)) out.push(q);
    } finally {
      if (hull) hull.delete();
      cnt.delete();
    }
  }
}

/* seuil de bruit d'une carte de gradient : médiane de |gx|+|gy| (échantillonnée) */
function gradNoise(gx, gy, n) {
  const hist = new Uint32Array(512);
  let m = 0;
  for (let i = 0; i < n; i += 7) { let v = Math.abs(gx[i]) + Math.abs(gy[i]); if (v > 511) v = 511; hist[v]++; m++; }
  let acc = 0, med = 0, p90 = 0;
  for (let v = 0; v < 512; v++) { acc += hist[v]; if (!med && acc >= m * 0.5) med = v; if (acc >= m * 0.9) { p90 = v; break; } }
  return { med, p90 };
}

/* renvoie le quadrilatère détecté (ordonné TL,TR,BR,BL, en pixels du canvas) ou null */
function detectQuad(canvas) {
  if (!cvReady) return null;
  const trash = [];
  const M = (m) => { trash.push(m); return m; };
  try {
    const src = M(cv.imread(canvas));
    const k = Math.min(1, DET_WORK / Math.max(src.cols, src.rows));
    const w = Math.max(8, Math.round(src.cols * k)), h = Math.max(8, Math.round(src.rows * k));
    const small = M(new cv.Mat());
    if (k < 1) cv.resize(src, small, new cv.Size(w, h), 0, 0, cv.INTER_AREA); else src.copyTo(small);

    // --- canaux : luminance + « couleur » (max - min des 3 canaux : feuille blanche sur nappe colorée)
    const gray = M(new cv.Mat());
    cv.cvtColor(small, gray, cv.COLOR_RGBA2GRAY);
    const planes = M(new cv.MatVector());
    cv.split(small, planes);
    const pr = M(planes.get(0)), pg = M(planes.get(1)), pb = M(planes.get(2));
    const mx = M(new cv.Mat()), mn = M(new cv.Mat()), chroma = M(new cv.Mat());
    cv.max(pr, pg, mx); cv.max(mx, pb, mx);
    cv.min(pr, pg, mn); cv.min(mn, pb, mn);
    cv.subtract(mx, mn, chroma);
    cv.GaussianBlur(chroma, chroma, new cv.Size(5, 5), 0);

    // --- luminance : version douce (garde les fines ombres) et version « sans texte »
    const g1 = M(new cv.Mat());
    cv.GaussianBlur(gray, g1, new cv.Size(3, 3), 0);
    const k5 = M(cv.Mat.ones(5, 5, cv.CV_8U)), k3 = M(cv.Mat.ones(3, 3, cv.CV_8U));
    const gc = M(new cv.Mat());
    cv.morphologyEx(gray, gc, cv.MORPH_CLOSE, k5);   // fermeture : efface le texte sombre
    cv.GaussianBlur(gc, gc, new cv.Size(5, 5), 0);

    // --- gradients (Sobel 3×3, 16 bits signés)
    const gx = M(new cv.Mat()), gy = M(new cv.Mat()), cxm = M(new cv.Mat()), cym = M(new cv.Mat());
    cv.Sobel(g1, gx, cv.CV_16S, 1, 0, 3); cv.Sobel(g1, gy, cv.CV_16S, 0, 1, 3);
    cv.Sobel(chroma, cxm, cv.CV_16S, 1, 0, 3); cv.Sobel(chroma, cym, cv.CV_16S, 0, 1, 3);

    // --- cartes de bords
    const nzG = gradNoise(gx.data16S, gy.data16S, w * h);
    const nzC = gradNoise(cxm.data16S, cym.data16S, w * h);
    const hiG = Math.max(24, Math.min(90, 2.2 * nzG.med + 14));
    const e1 = M(new cv.Mat()), e2 = M(new cv.Mat()), e3 = M(new cv.Mat());
    cv.Canny(gc, e1, hiG * 0.4, hiG);                // bords francs, texte effacé
    cv.Canny(g1, e2, hiG * 0.4, hiG);                // tout, y compris ombres fines
    const hiC = Math.max(30, Math.min(120, 3 * nzC.med + 20));
    cv.Canny(chroma, e3, hiC * 0.4, hiC);
    const edges = M(new cv.Mat());
    cv.bitwise_or(e1, e2, edges); cv.bitwise_or(edges, e3, edges);

    // --- candidats A : contours de masques
    const cands = [];
    const m1 = M(new cv.Mat());
    cv.threshold(gc, m1, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);
    cv.morphologyEx(m1, m1, cv.MORPH_OPEN, k5);
    quadsFromMask(m1, w, h, cands, M);
    const m2 = M(new cv.Mat());
    cv.threshold(chroma, m2, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);
    cv.morphologyEx(m2, m2, cv.MORPH_OPEN, k5);
    quadsFromMask(m2, w, h, cands, M);
    // régions fermées par des bords (feuille blanche sur table blanche : seule l'ombre la délimite)
    const m3 = M(new cv.Mat());
    cv.bitwise_or(e1, e3, m3);
    cv.dilate(m3, m3, k3);
    cv.bitwise_not(m3, m3);
    quadsFromMask(m3, w, h, cands, M);
    const m4 = M(new cv.Mat());
    cv.dilate(edges, m4, k3);
    cv.bitwise_not(m4, m4);
    quadsFromMask(m4, w, h, cands, M);

    // --- candidats B : droites de Hough combinées en quadrilatères
    const segs = M(new cv.Mat());
    const minLen = Math.round(0.10 * Math.min(w, h));
    cv.HoughLinesP(edges, segs, 1, Math.PI / 180, 22, minLen, 4);
    const lines = mergeSegments(segs.data32S, segs.rows, 90);
    for (const q of quadsFromLines(lines, w, h, 220)) cands.push(q);

    // --- notation de tous les candidats (JS pur, plus aucune allocation OpenCV d'ici la fin)
    const G = {
      w, h, gx: gx.data16S, gy: gy.data16S, cx: cxm.data16S, cy: cym.data16S,
      tG: Math.max(14, 2.5 * nzG.med), tC: Math.max(18, 3 * nzC.med + 8), bits: new Uint8Array(1024), pk: new Int8Array(4096),
    };
    const evalQuad = (q) => {
      if (!quadPlausible(q, w, h)) return null;
      const s = quadScore(q, G);
      if (!s) return null;
      let strong = 0;
      for (const v of s.sides) if (v >= 0.55) strong++;
      if (s.mean < 0.5 || s.min < 0.25 || strong < 3) return null;
      const th = quadThrough(q, G, s);
      const area = Math.abs(quadSignedArea(q)) / (w * h);
      s.through = th;
      s.area = area;
      if (th.crossed) return null;
      s.score = s.mean * (0.6 + 0.4 * s.min) * (1 - 0.3 * th.frac);
      // un côté qui continue au-delà d'un coin = document probablement tronqué : on n'accepte
      // qu'un seul cas, et seulement si tout le reste est très net ; sinon mieux vaut null
      if (th.ends >= 2 || (th.ends === 1 && s.score < DET_STRICT)) return null;
      s.rank = s.score * area;   // à preuve égale, le plus grand : évite de s'arrêter sur une ligne imprimée
      s.q = q;
      return s;
    };
    const scored = [];
    for (const q of cands) { const s = evalQuad(q); if (s) scored.push(s); }
    if (!scored.length) return null;
    scored.sort((a, b) => b.rank - a.rank);
    // recalage des meilleurs, puis choix final
    let best = null;
    for (let i = 0; i < Math.min(6, scored.length); i++) {
      let s = scored[i];
      for (let it = 0; it < 2; it++) {
        const r = quadRefine(s.q, G, s);
        if (!r) break;
        const s2 = evalQuad(r);
        if (!s2 || s2.score < s.score - 0.02) break;
        s = s2;
      }
      if (!best || s.rank > best.rank) best = s;
    }
    if (best.score < DET_ACCEPT) return null;
    return orderCorners(best.q.map(p => ({ x: p.x / k, y: p.y / k })));
  } catch (err) {
    console.warn('Détection échouée', err);
    return null;
  } finally {
    trash.forEach((t) => { try { if (t) t.delete(); } catch (_) {} });
  }
}

/* détection sur une copie réduite (rapide, et les réglages de detectQuad sont
   calibrés pour des images de quelques centaines de px), puis remise à l'échelle */
function detectScaled(canvas) {
  const s = Math.min(1, DETECT_SIDE / Math.max(canvas.width, canvas.height));
  if (s === 1) return detectQuad(canvas);
  const small = document.createElement('canvas');
  small.width = Math.round(canvas.width * s); small.height = Math.round(canvas.height * s);
  small.getContext('2d').drawImage(canvas, 0, 0, small.width, small.height);
  const q = detectQuad(small);
  const kx = canvas.width / small.width, ky = canvas.height / small.height;
  releaseCanvas(small);
  return q ? q.map(p => ({ x: p.x * kx, y: p.y * ky })) : null;
}

function detectCorners(canvas) {
  return detectScaled(canvas) || fallbackRect(canvas.width, canvas.height);
}

/* ordonne les coins : TL, TR, BR, BL */
function orderCorners(pts) {
  const bySum = [...pts].sort((a, b) => (a.x + a.y) - (b.x + b.y));
  const tl = bySum[0], br = bySum[3];
  const byDiff = [...pts].sort((a, b) => (a.y - a.x) - (b.y - b.x));
  const tr = byDiff[0], bl = byDiff[3];
  if (new Set([tl, tr, br, bl]).size === 4) return [tl, tr, br, bl];
  const cx = pts.reduce((s, p) => s + p.x, 0) / 4, cy = pts.reduce((s, p) => s + p.y, 0) / 4;
  const cw = [...pts].sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));
  const i0 = cw.indexOf(tl);
  return [0, 1, 2, 3].map(k => cw[(i0 + k) % 4]);
}

/* ============================================================
   ÉDITEUR
   ============================================================ */
const DISPLAY_MAX = 1; // ratio géré par CSS, on stocke l'échelle
let dragIndex = -1;

let livePreview = false;
try { livePreview = localStorage.getItem('scanLivePreview') === '1'; } catch (_) { /* cookies bloqués */ }

function openEditor(state) {
  closeEditor();
  editState = state;
  if (typeof editState.darkness !== 'number') editState.darkness = 50;
  $('capInfo').textContent = editState.info || '';
  show('editor');
  $('livePreviewToggle').checked = livePreview;
  updateDarknessUI();
  renderEditorImage(true);
}

/* libère le Mat de normalisation N&B mis en cache sur un editState */
function clearNormCache(state) {
  if (state && state._normMat) { state._normMat.delete(); state._normMat = null; }
}

/* canvas source tourné, mis en cache par angle (évite une copie pleine
   résolution à chaque affichage) */
function editRotated(st) {
  const deg = ((st.rotation % 360) + 360) % 360;
  if (st._rc && st._rcDeg === deg) return st._rc;
  if (st._rc && st._rc !== st.base) releaseCanvas(st._rc);
  st._rc = rotatedCanvas(st.base, deg);
  st._rcDeg = deg;
  return st._rc;
}

/* ferme l'éditeur en libérant sa mémoire (Mat OpenCV + canvas pleine résolution) */
function closeEditor() {
  if (editState) {
    clearNormCache(editState);
    if (editState._rc && editState._rc !== editState.base) releaseCanvas(editState._rc);
    releaseCanvas(editState.base);
  }
  editState = null;
}

/* image affichée dans l'éditeur : brute, ou filtrée en direct si aperçu actif.
   Le N&B est coûteux : on cache la normalisation de fond (bwComputeNorm) par
   rotation et on ne refait que la courbe de niveaux (bwApplyLevels) à chaque
   geste du curseur de noirceur, sinon le slider rame. */
function buildDisplayCanvas() {
  const rc = editRotated(editState);
  // copie réduite pour l'affichage (la loupe, elle, lit la pleine résolution)
  const maxSide = 1800;   // à 1100 px le petit texte d'un ticket n'est lisible avec aucun réglage
  const scale = Math.min(1, maxSide / Math.max(rc.width, rc.height));
  const pc = document.createElement('canvas');
  pc.width = Math.round(rc.width * scale);
  pc.height = Math.round(rc.height * scale);
  pc.getContext('2d').drawImage(rc, 0, 0, pc.width, pc.height);
  if (!livePreview) return pc;

  if (cvReady) {
    if (!editState._normMat || editState._normRotation !== editState.rotation) {
      clearNormCache(editState);
      editState._normMat = bwComputeNorm(pc);
      editState._normRotation = editState.rotation;
    }
    const out = bwApplyLevels(editState._normMat, pc.width, pc.height, editState.darkness);
    releaseCanvas(pc);
    return out;
  }
  return applyFilter(pc, editState.darkness);
}

let _previewPending = false;
function renderEditorImage(relayout) {
  const img = $('editImg');
  const disp = buildDisplayCanvas();
  img.onload = relayout ? (() => { if (editState) layoutEditor(); }) : null;
  img.src = disp.toDataURL('image/jpeg', 0.85);
  if (disp !== editState._rc && disp !== editState.base) releaseCanvas(disp);
}
function schedulePreview() {
  if (!livePreview || _previewPending) return;
  _previewPending = true;
  requestAnimationFrame(() => { _previewPending = false; if (editState) renderEditorImage(false); });
}

/* place le curseur de noirceur sur la valeur de la page */
function updateDarknessUI() {
  $('darknessSlider').value = editState.darkness;
}

async function openEditorForPage(i) {
  // ré-édition : on repart de la photo source (gardée en JPEG, pas en canvas)
  const p = pages[i];
  if (!p) return;
  showLoader('Ouverture…');
  try {
    const bmp = await createImageBitmap(p.baseBlob);
    const base = bitmapToCanvas(bmp, MAX_SIDE);
    freeBitmap(bmp);
    openEditor({
      base, baseBlob: p.baseBlob, corners: p.corners.map(q => ({ ...q })),
      rotation: p.rotation, darkness: p.darkness, pageIndex: i,
    });
  } catch (err) {
    console.error(err); toast('Impossible de rouvrir cette page.');
  } finally {
    hideLoader();
  }
}

function rotatedCanvas(canvas, deg) {
  deg = ((deg % 360) + 360) % 360;
  if (deg === 0) return canvas;
  const c = document.createElement('canvas');
  const swap = (deg === 90 || deg === 270);
  c.width = swap ? canvas.height : canvas.width;
  c.height = swap ? canvas.width : canvas.height;
  const ctx = c.getContext('2d');
  ctx.translate(c.width / 2, c.height / 2);
  ctx.rotate(deg * Math.PI / 180);
  ctx.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
  return c;
}

/* coordonnées des coins après rotation visuelle */
function rotateCorners(corners, baseW, baseH, deg) {
  deg = ((deg % 360) + 360) % 360;
  return corners.map(p => {
    if (deg === 0)   return { x: p.x,          y: p.y };
    if (deg === 90)  return { x: baseH - p.y,  y: p.x };
    if (deg === 180) return { x: baseW - p.x,  y: baseH - p.y };
    return { x: p.y, y: baseW - p.x }; // 270
  });
}

function layoutEditor() {
  const img = $('editImg');
  const svg = $('editSvg');
  const wrap = $('canvasWrap');
  // position/taille RÉELLES de l'image à l'écran (repère fiable, anti-décalage)
  const wr = wrap.getBoundingClientRect();
  const ir = img.getBoundingClientRect();
  const dispW = ir.width, dispH = ir.height;
  if (!dispW || !dispH) return;   // image pas encore à l'écran
  // le SVG est posé EXACTEMENT sur l'image
  svg.style.left = (ir.left - wr.left) + 'px';
  svg.style.top = (ir.top - wr.top) + 'px';
  svg.style.width = dispW + 'px';
  svg.style.height = dispH + 'px';
  svg.setAttribute('viewBox', `0 0 ${dispW} ${dispH}`);

  // canvas source affiché (après rotation) + facteur d'échelle
  const rc = editRotated(editState);
  const sx = dispW / rc.width, sy = dispH / rc.height;
  const cornersRot = rotateCorners(editState.corners, editState.base.width, editState.base.height, editState.rotation);
  editState._disp = cornersRot.map(p => ({ x: p.x * sx, y: p.y * sy }));
  editState._scale = { sx, sy, srcW: rc.width, srcH: rc.height, dispW, dispH };
  drawEditor();
}

function drawEditor() {
  const svg = $('editSvg');
  const c = editState._disp;
  svg.innerHTML = '';
  const ns = 'http://www.w3.org/2000/svg';
  // polygone
  const poly = document.createElementNS(ns, 'polygon');
  poly.setAttribute('points', c.map(p => `${p.x},${p.y}`).join(' '));
  poly.setAttribute('class', 'edge');
  svg.appendChild(poly);
  // poignées : grosse zone tactile invisible + pastille visible
  c.forEach((p, i) => {
    const hit = document.createElementNS(ns, 'circle');
    hit.setAttribute('cx', p.x); hit.setAttribute('cy', p.y);
    hit.setAttribute('r', 30); hit.setAttribute('class', 'hit');
    svg.appendChild(hit);
    const circ = document.createElementNS(ns, 'circle');
    circ.setAttribute('cx', p.x); circ.setAttribute('cy', p.y);
    circ.setAttribute('r', 11); circ.setAttribute('class', 'corner');
    svg.appendChild(circ);
  });
}

/* loupe : zoom autour de la poignée en cours, pour viser précis */
function updateLoupe(idx) {
  const lp = $('loupe');
  if (idx < 0) { lp.classList.remove('show'); return; }
  const p = editState._disp[idx];
  const { sx, sy } = editState._scale;
  const rc = editState._rc;
  const cx = p.x / sx, cy = p.y / sy;      // centre dans le canvas source
  const zoom = 2.6, R = lp.width;
  const srcR = (R / zoom) / 2;
  const ctx = lp.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, R, R);
  ctx.save();
  ctx.beginPath(); ctx.arc(R / 2, R / 2, R / 2, 0, Math.PI * 2); ctx.clip();
  ctx.drawImage(rc, cx - srcR, cy - srcR, srcR * 2, srcR * 2, 0, 0, R, R);
  // réticule
  ctx.strokeStyle = 'rgba(247,130,27,.95)'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(R / 2 - 14, R / 2); ctx.lineTo(R / 2 + 14, R / 2);
  ctx.moveTo(R / 2, R / 2 - 14); ctx.lineTo(R / 2, R / 2 + 14);
  ctx.stroke();
  ctx.restore();
  lp.classList.add('show');
}

/* drag des poignées (tactile + souris) — repère ancré sur l'image */
let dragOffset = { x: 0, y: 0 };
function pointerPos(e) {
  const r = $('editSvg').getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}
function nearestCorner(pos) {
  let idx = -1, min = 44 * 44;
  editState._disp.forEach((p, i) => {
    const d = (p.x - pos.x) ** 2 + (p.y - pos.y) ** 2;
    if (d < min) { min = d; idx = i; }
  });
  return idx;
}
function startDrag(e) {
  if (!editState || !editState._disp) return;
  const pos = pointerPos(e);
  dragIndex = nearestCorner(pos);
  if (dragIndex >= 0) {
    e.preventDefault();
    const c = editState._disp[dragIndex];
    dragOffset = { x: c.x - pos.x, y: c.y - pos.y }; // prise sans saut
    updateLoupe(dragIndex);
  }
}
function moveDrag(e) {
  if (dragIndex < 0) return;
  e.preventDefault();
  const pos = pointerPos(e);
  const { dispW, dispH } = editState._scale;
  const d = editState._disp;
  d[dragIndex].x = Math.max(0, Math.min(dispW, pos.x + dragOffset.x));
  d[dragIndex].y = Math.max(0, Math.min(dispH, pos.y + dragOffset.y));
  drawEditor();
  updateLoupe(dragIndex);
}
function endDrag() {
  if (dragIndex >= 0) {
    editState.corners = dispToSource(editState); // on fige les coins (survit aux rotations)
    updateLoupe(-1);
  }
  dragIndex = -1;
}

const wrap = $('canvasWrap');
wrap.addEventListener('touchstart', startDrag, { passive: false });
wrap.addEventListener('touchmove', moveDrag, { passive: false });
wrap.addEventListener('touchend', endDrag);
wrap.addEventListener('touchcancel', endDrag);
wrap.addEventListener('mousedown', startDrag);
window.addEventListener('mousemove', moveDrag);
window.addEventListener('mouseup', endDrag);

/* convertit les coins affichés -> coords source d'origine (avant rotation) */
function dispToSource(st) {
  const { sx, sy } = st._scale;
  const rotPts = st._disp.map(p => ({ x: p.x / sx, y: p.y / sy }));
  // inverse de rotateCorners
  const deg = ((st.rotation % 360) + 360) % 360;
  const W = st.base.width, H = st.base.height;   // tourné de 90/270 : largeur = H, hauteur = W
  return rotPts.map(p => {
    if (deg === 0)   return { x: p.x, y: p.y };
    if (deg === 90)  return { x: p.y, y: H - p.x };
    if (deg === 180) return { x: W - p.x, y: H - p.y };
    return { x: W - p.y, y: p.x }; // 270
  });
}

/* ============================================================
   Rendu final d'une page : warp + filtre
   ============================================================ */
function renderPage(st) {
  // part des coins figés en coordonnées source : ne dépend pas de l'affichage
  // (plus de plantage si on valide avant que l'image soit à l'écran)
  const rc = editRotated(st);
  const r = rotateCorners(st.corners, st.base.width, st.base.height, st.rotation);
  // rotateCorners garde l'ordre source : on décale pour que le coin affiché en
  // haut à gauche devienne le haut-gauche de la page (sinon le warp annule la rotation)
  const k = (((st.rotation % 360) + 360) % 360) / 90;
  const corners = r.map((_, i) => r[(i - k + 4) % 4]);
  const [tl, tr, br, bl] = corners;
  const wTop = dist(tl, tr), wBot = dist(bl, br);
  const hL = dist(tl, bl), hR = dist(tr, br);
  let outW = Math.round(Math.max(wTop, wBot));
  let outH = Math.round(Math.max(hL, hR));
  outW = Math.max(50, outW); outH = Math.max(50, outH);

  let warped;
  if (cvReady) warped = warpCv(rc, corners, outW, outH);
  else warped = warpFallback(rc, corners, outW, outH);

  const out = applyFilter(warped, st.darkness);
  if (out !== warped) releaseCanvas(warped);
  return out;
}
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

function warpCv(canvas, c, outW, outH) {
  return withMats((M) => {
    const src = M(cv.imread(canvas));
    const dst = M(new cv.Mat());
    const srcTri = M(cv.matFromArray(4, 1, cv.CV_32FC2, [c[0].x, c[0].y, c[1].x, c[1].y, c[2].x, c[2].y, c[3].x, c[3].y]));
    const dstTri = M(cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, outW, 0, outW, outH, 0, outH]));
    const T = M(cv.getPerspectiveTransform(srcTri, dstTri));
    cv.warpPerspective(src, dst, T, new cv.Size(outW, outH), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar(255, 255, 255, 255));
    const out = document.createElement('canvas');
    out.width = outW; out.height = outH;
    cv.imshow(out, dst);
    return out;
  });
}

/* exécute fn(M) et libère tous les Mat enregistrés via M(), même en cas d'erreur */
function withMats(fn) {
  const trash = [];
  try { return fn((m) => { trash.push(m); return m; }); }
  finally { trash.forEach((m) => { try { m.delete(); } catch (_) {} }); }
}

/* fallback : simple crop à la bounding box (sans correction de perspective) */
function warpFallback(canvas, c, outW, outH) {
  const minX = Math.min(...c.map(p => p.x)), maxX = Math.max(...c.map(p => p.x));
  const minY = Math.min(...c.map(p => p.y)), maxY = Math.max(...c.map(p => p.y));
  const out = document.createElement('canvas');
  out.width = outW; out.height = outH;
  out.getContext('2d').drawImage(canvas, minX, minY, maxX - minX, maxY - minY, 0, 0, outW, outH);
  return out;
}

/* ============================================================
   Filtres
   ============================================================ */
/* l'app ne fait que du noir et blanc document */
function applyFilter(canvas, darkness) {
  if (cvReady) return bwCv(canvas, darkness);
  return grayJs(canvas, false); // repli si OpenCV non chargé
}

/* Étape LOURDE (à ne calculer qu'une fois par image) : carte d'encre normalisée.
   1) fond du papier par fermeture morphologique sur une copie réduite ET lissée
      (sans le lissage, la fermeture suit les pics du bruit et le papier sort gris) ;
   2) division -> absorbance (0 = papier, 255 = noir), ombres et éclairage effacés ;
   3) égalisation de l'encre : chaque trait est rapporté à la crête d'encre la plus
      proche (max local à l'échelle du trait), avec un plancher lié à l'encre du
      voisinage et au bruit mesuré -> un ticket thermique pâle sort aussi noir
      qu'une impression laser, sans faire monter le grain du papier.
   Pas de médian ni de flou sur le trait lui-même : les traits fins restent entiers.
   Renvoie un cv.Mat 8 bits (0 = papier, 255 = encre pleine) à libérer par l'appelant. */
function bwComputeNorm(canvas) {
  return withMats((M) => {
  const odd = (k) => { k = Math.round(k); return k % 2 === 0 ? k + 1 : k; };
  // deux moyennes glissantes = quasi-gaussien (sigma = n/2,45), 10 à 30x plus rapide ici
  const soften = (m, n) => { const s = new cv.Size(n, n); cv.blur(m, m, s); cv.blur(m, m, s); };
  const gray = M(new cv.Mat());
  withMats((T) => {            // l'image RGBA (4x plus lourde) est libérée tout de suite
    const src = T(cv.imread(canvas));
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
  });
  const w = gray.cols, h = gray.rows;

  // --- fond du papier, sur une copie réduite (<= 1400 px)
  const scale = Math.min(1, 1400 / Math.max(w, h));
  const sw = Math.max(1, Math.round(w * scale));
  const sh = Math.max(1, Math.round(h * scale));
  const small = M(new cv.Mat());
  if (scale < 1) cv.resize(gray, small, new cv.Size(sw, sh), 0, 0, cv.INTER_AREA);
  else gray.copyTo(small);
  const ks = Math.max(15, odd(Math.max(sw, sh) / 40));
  soften(small, 5);
  // noyau rectangulaire : séparable, bien plus rapide que l'ellipse
  const kBg = M(cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(ks, ks)));
  cv.morphologyEx(small, small, cv.MORPH_CLOSE, kBg);
  soften(small, odd(ks * 0.4));
  const big = M(new cv.Mat());   // fond à pleine taille, réutilisé plus bas
  if (scale < 1) cv.resize(small, big, new cv.Size(w, h), 0, 0, cv.INTER_LINEAR);
  else small.copyTo(big);

  // --- absorbance : 0 = papier, 255 = noir (sur place dans gray)
  cv.divide(gray, big, gray, 255);
  cv.bitwise_not(gray, gray);
  const ab = gray;
  const a1 = M(new cv.Mat());    // version à peine lissée, pour les mesures seulement
  cv.GaussianBlur(ab, a1, new cv.Size(5, 5), 0.8, 0.8, cv.BORDER_DEFAULT);

  // --- niveau de bruit (résidu haute fréquence, écrêté pour ignorer les bords de lettres)
  cv.absdiff(ab, a1, big);
  cv.threshold(big, big, 24, 0, cv.THRESH_TRUNC);
  const floor = Math.round(Math.min(255, Math.max(44, 20 * cv.mean(big)[0])));

  // --- force d'encre du voisinage (copie réduite) : max local large, adouci
  if (scale < 1) cv.resize(a1, small, new cv.Size(sw, sh), 0, 0, cv.INTER_AREA);
  else a1.copyTo(small);
  const k2 = Math.max(9, odd(Math.max(sw, sh) / 28));
  const kInk = M(cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(k2, k2)));
  cv.dilate(small, small, kInk);
  soften(small, odd(k2 * 0.6));
  cv.convertScaleAbs(small, small, 0.85, 0);
  const flo = M(new cv.Mat(small.rows, small.cols, cv.CV_8UC1, new cv.Scalar(floor)));
  cv.max(small, flo, small);     // plancher : le grain d'une zone vide n'est jamais amplifié
  if (scale < 1) cv.resize(small, big, new cv.Size(w, h), 0, 0, cv.INTER_LINEAR);
  else small.copyTo(big);

  // --- crête d'encre à l'échelle du trait (pleine résolution)
  const k1 = Math.max(3, odd(Math.max(w, h) / 250));
  const kStroke = M(cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(k1, k1)));
  cv.dilate(a1, a1, kStroke);
  cv.blur(a1, a1, new cv.Size(k1, k1));
  cv.max(a1, big, big);

  const norm = new cv.Mat();     // rendu à l'appelant : pas dans la corbeille
  try { cv.divide(ab, big, norm, 255); } catch (err) { norm.delete(); throw err; }
  return norm;
  });
}

/* Étape LÉGÈRE (recalculée à chaque geste du curseur) : une simple table de
   niveaux sur la carte d'encre. darkness 0..100, monotone : plus on monte, plus
   les seuils descendent -> traits plus épais et plus noirs. 50 = réglage mesuré. */
function bwApplyLevels(normMat, outWidth, outHeight, darkness) {
  let d = (typeof darkness === 'number') ? darkness : 50;
  d = Math.min(100, Math.max(0, d)) / 100;
  // (seuil blanc, seuil noir) en fraction de l'encre locale : clair / défaut / foncé
  const P = [[0.45, 1.25], [0.25, 0.90], [0.12, 0.60]];
  const a = d <= 0.5 ? P[0] : P[1], b = d <= 0.5 ? P[1] : P[2];
  const u = d <= 0.5 ? d * 2 : d * 2 - 1;
  const lo = a[0] + (b[0] - a[0]) * u;
  const hi = a[1] + (b[1] - a[1]) * u;
  return withMats((M) => {
  const lut = M(new cv.Mat(1, 256, cv.CV_8U));
  const ld = lut.data;
  for (let i = 0; i < 256; i++) {
    let v = (i / 255 - lo) / (hi - lo);
    v = v < 0 ? 0 : v > 1 ? 1 : v;
    ld[i] = 255 - Math.round(v * 255);
  }
  const out8 = M(new cv.Mat());
  cv.LUT(normMat, lut, out8);

  const out = document.createElement('canvas');
  out.width = outWidth; out.height = outHeight;
  cv.imshow(out, out8);
  return out;
  });
}

/* N&B "document" facon Genius : combine les deux étapes (rendu final, one-shot). */
function bwCv(canvas, darkness) {
  const norm = bwComputeNorm(canvas);
  const out = bwApplyLevels(norm, canvas.width, canvas.height, darkness);
  norm.delete();
  return out;
}

/* gris pur, ou seuillage Otsu en JS si threshold=true */
function grayJs(canvas, threshold) {
  const ctx = canvas.getContext('2d');
  const im = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = im.data;
  const hist = new Array(256).fill(0);
  for (let i = 0; i < d.length; i += 4) {
    const g = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0;
    d[i] = d[i + 1] = d[i + 2] = g;
    hist[g]++;
  }
  if (threshold) {
    const total = canvas.width * canvas.height;
    let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
    let sumB = 0, wB = 0, max = 0, thr = 127;
    for (let i = 0; i < 256; i++) {
      wB += hist[i]; if (!wB) continue;
      const wF = total - wB; if (!wF) break;
      sumB += i * hist[i];
      const mB = sumB / wB, mF = (sum - sumB) / wF;
      const between = wB * wF * (mB - mF) ** 2;
      if (between > max) { max = between; thr = i; }
    }
    for (let i = 0; i < d.length; i += 4) {
      const v = d[i] > thr ? 255 : 0;
      d[i] = d[i + 1] = d[i + 2] = v;
    }
  }
  ctx.putImageData(im, 0, 0);
  return canvas;
}

          PDF
          <span class="hint">1 fichier, multi-pages</span>
        </button>
        <button id="expJpg">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>

function dateStamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}-${p(d.getMonth() + 1)}-${d.getFullYear()}_${p(d.getHours())}h${p(d.getMinutes())}`;
}

async function exportPDF() {
  showLoader('Création du PDF…');
  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4' });
    const pageW = 210, pageH = 297, margin = 8;
    const maxW = pageW - margin * 2, maxH = pageH - margin * 2;
    for (let i = 0; i < pages.length; i++) {
      const p = pages[i];
      if (i > 0) pdf.addPage();
      const ratio = Math.min(maxW / p.w, maxH / p.h);
      const w = p.w * ratio, h = p.h * ratio;
      const x = (pageW - w) / 2, y = (pageH - h) / 2;
      // JPEG déjà encodé inséré tel quel : aucune recompression
      const bytes = new Uint8Array(await p.blob.arrayBuffer());
      pdf.addImage(bytes, 'JPEG', x, y, w, h);
    }
    const name = `Scan_${dateStamp()}.pdf`;
    const blob = pdf.output('blob');
    hideLoader();   // sinon il reste derrière le partage et bloque tout s'il ne revient pas
    const shared = await shareOrDownload(blob, name, 'application/pdf');
    if (shared) { show('home'); refreshHome(); }
  } catch (err) {
    console.error(err); toast('Erreur PDF.');
  } finally { hideLoader(); }
}

async function exportJPG() {
  showLoader('Préparation…');
  try {
    const stamp = dateStamp();
    const files = pages.map((p, i) => {
      const suffix = pages.length > 1 ? `_${i + 1}` : '';
      return new File([p.blob], `Scan_${stamp}${suffix}.jpg`, { type: 'image/jpeg' });
    });
    if (navigator.canShare && navigator.canShare({ files })) {
      hideLoader();
      await navigator.share({ files });
      show('home'); refreshHome();
    } else {
      // pas de partage multi-fichiers : on télécharge chacun
      hideLoader();
      files.forEach(f => downloadFile(f, f.name));
      toast('Images téléchargées.');
      show('home'); refreshHome();
    }
  } catch (err) {
    if (err && err.name === 'AbortError') { hideLoader(); return; }
    console.error(err); hideLoader(); toast('Erreur image.');
  }
}

/* Retourne true si le fichier a été partagé/téléchargé, false si l'utilisateur a annulé. */
async function shareOrDownload(blob, name, type) {
  const file = new File([blob], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return true; }
    catch (err) {
      if (err && err.name === 'AbortError') return false;
      // le partage existe mais a échoué : ne pas annoncer un fichier enregistré
      console.error(err); toast('Partage impossible, réessaie.'); return false;
    }
  }
  downloadFile(blob, name);
  toast('Fichier téléchargé.');
  return true;
}

function downloadFile(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

/* ============================================================
   PWA (manifest injecté à la volée)
   ============================================================ */
(function injectManifest() {
  const icon = (sz) => {
    const c = document.createElement('canvas');
    c.width = c.height = sz;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#F7821B'; ctx.fillRect(0, 0, sz, sz);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = sz * 0.06; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const m = sz * 0.28, q = sz * 0.12;
    ctx.beginPath();
    ctx.moveTo(m, m + q); ctx.lineTo(m, m); ctx.lineTo(m + q, m); // TL
    ctx.moveTo(sz - m - q, m); ctx.lineTo(sz - m, m); ctx.lineTo(sz - m, m + q); // TR
    ctx.moveTo(sz - m, sz - m - q); ctx.lineTo(sz - m, sz - m); ctx.lineTo(sz - m - q, sz - m); // BR
    ctx.moveTo(m + q, sz - m); ctx.lineTo(m, sz - m); ctx.lineTo(m, sz - m - q); // BL
    ctx.stroke();
    return c.toDataURL('image/png');
  };
  const manifest = {
    name: 'Scanner', short_name: 'Scanner',
    start_url: '.', display: 'standalone',
    background_color: '#ffffff', theme_color: '#ffffff',
    icons: [
      { src: icon(192), sizes: '192x192', type: 'image/png' },
      { src: icon(512), sizes: '512x512', type: 'image/png' },
    ],
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
  const link = document.createElement('link');
  link.rel = 'manifest'; link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
  // icône Apple
  const apple = document.createElement('link');
  apple.rel = 'apple-touch-icon'; apple.href = icon(180);
  document.head.appendChild(apple);
})();
